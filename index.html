<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Landscape Waktu Solat Display</title>
  <style>
    :root {
      --gold: #ffd166;
      --teal: #06d6a0;
      --cyan: #48cae4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #000000;
      color: #ffffff;
    }

    /* Dynamic Mosque Background */
    #bg-carousel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      background-size: cover;
      background-position: center;
      transition: background-image 2s ease-in-out;
    }

    /* Dark Overlay for Sunlight / Background High Contrast Readability */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.65) 100%);
    }

    /* Main Dashboard Layout */
    .dashboard-container {
      position: relative;
      z-index: 3;
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 14px 24px;
      gap: 12px;
    }

    .transparent-card {
      background: transparent;
      border: none;
      padding: 10px;
    }

    /* TOP HEADER: Quran Banner */
    .quran-box {
      text-align: center;
    }

    .quran-ar {
      font-size: 1.45rem;
      color: var(--gold);
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 4px rgba(0,0,0,0.9);
    }

    .quran-en {
      font-size: 0.95rem;
      color: #ffffff;
      font-style: italic;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
    }

    /* MIDDLE CONTENT: 3 Columns */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr;
      gap: 20px;
      height: 100%;
      min-height: 0;
    }

    .col-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* LEFT COL: Clock & Date */
    .time-title {
      font-size: 0.9rem;
      letter-spacing: 2px;
      color: var(--cyan);
      font-weight: 800;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .clock-display {
      font-size: 3.8rem;
      font-weight: 800;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      text-shadow: 0 0 16px rgba(72, 202, 228, 0.9), 0 3px 8px rgba(0,0,0,1);
      margin: 8px 0;
    }

    .gregorian-date {
      font-size: 1.25rem;
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .hijri-date {
      font-size: 1.1rem;
      color: var(--gold);
      margin-top: 4px;
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    /* CENTER COL: Address + Waktu Solat Table */
    .center-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
    }

    .address-box {
      text-align: center;
      padding: 6px;
    }

    .address-box strong {
      color: var(--cyan);
      font-size: 1.05rem;
      display: block;
      text-shadow: 0 2px 6px rgba(0,0,0,0.95);
    }

    .address-box span {
      font-size: 0.85rem;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.95);
    }

    .solat-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .solat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 20px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.25);
    }

    .solat-row.active {
      background: linear-gradient(90deg, rgba(6, 214, 160, 0.5) 0%, rgba(72, 202, 228, 0.35) 100%);
      border: 1px solid var(--teal);
      box-shadow: 0 0 14px rgba(6, 214, 160, 0.6);
    }

    .solat-name {
      font-size: 1.45rem;
      font-weight: 800;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
    }

    .solat-time {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
    }

    /* RIGHT COL: Countdown */
    .next-label {
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    .next-prayer {
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--teal);
      margin: 6px 0;
      text-shadow: 0 0 14px rgba(6, 214, 160, 0.8), 0 3px 8px rgba(0,0,0,1);
    }

    .countdown-box {
      font-size: 3.2rem;
      font-weight: 900;
      color: var(--gold);
      font-family: 'Courier New', Courier, monospace;
      text-shadow: 0 0 12px rgba(255, 209, 102, 0.6), 0 3px 8px rgba(0,0,0,1);
    }

    /* BOTTOM FOOTER: Hadith */
    .footer-bar {
      text-align: center;
    }

    .hadith-ar {
      font-size: 1.2rem;
      color: var(--gold);
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
    }

    .hadith-en {
      font-size: 0.9rem;
      color: #ffffff;
      font-style: italic;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
    }
  </style>
</head>
<body>

  <!-- Dynamic Solat-Based Background -->
  <div id="bg-carousel"></div>
  <div class="bg-overlay"></div>

  <div class="dashboard-container">
    
    <!-- TOP SECTION: Quran Verse -->
    <div class="quran-box transparent-card">
      <div class="quran-ar" id="quran-ar">Loading...</div>
      <div class="quran-en" id="quran-en">Loading...</div>
    </div>

    <!-- MAIN DISPLAY (3 COLUMNS) -->
    <div class="main-grid">
      
      <!-- LEFT: Date & Time -->
      <div class="col-card transparent-card">
        <div class="time-title">CURRENT TIME</div>
        <div class="clock-display" id="clock">00:00:00</div>
        <div class="gregorian-date" id="gregorian-date">Loading...</div>
        <div class="hijri-date" id="hijri-date">Loading...</div>
      </div>

      <!-- CENTER: Address Box ON TOP of Solat Box -->
      <div class="center-column">
        <div class="address-box transparent-card">
          <strong>📍 No 8, Jalan Serene 3/4, Serene Heights</strong>
          <span>43500 Semenyih, Selangor (JAKIM: SGR01)</span>
        </div>

        <div class="solat-container transparent-card">
          <div class="solat-row" id="row-subuh"><span class="solat-name">Subuh</span><span class="solat-time" id="time-subuh">05:52 AM</span></div>
          <div class="solat-row" id="row-syuruk"><span class="solat-name">Syuruk</span><span class="solat-time" id="time-syuruk">07:03 AM</span></div>
          <div class="solat-row" id="row-zohor"><span class="solat-name">Zohor</span><span class="solat-time" id="time-zohor">01:15 PM</span></div>
          <div class="solat-row" id="row-asar"><span class="solat-name">Asar</span><span class="solat-time" id="time-asar">04:21 PM</span></div>
          <div class="solat-row" id="row-maghrib"><span class="solat-name">Maghrib</span><span class="solat-time" id="time-maghrib">07:20 PM</span></div>
          <div class="solat-row" id="row-isyak"><span class="solat-name">Isyak</span><span class="solat-time" id="time-isyak">08:29 PM</span></div>
        </div>
      </div>

      <!-- RIGHT: Countdown -->
      <div class="col-card transparent-card">
        <div class="next-label">COUNTDOWN TO</div>
        <div class="next-prayer" id="next-prayer-name">--</div>
        <div class="countdown-box" id="countdown">00:00:00</div>
      </div>
    </div>

    <!-- BOTTOM SECTION: Hadith -->
    <div class="footer-bar transparent-card">
      <div class="hadith-ar" id="hadith-ar">Loading...</div>
      <div class="hadith-en" id="hadith-en">Loading...</div>
    </div>

  </div>

  <script>
    // Pure Islamic & Malaysian Mosque Sceneries Matched to Prayer Slots
    const prayerBackgrounds = {
      subuh: 'https://images.unsplash.com/photo-1596422846543-75c6fc197f07?auto=format&fit=crop&w=1920&q=80',   // Sunrise over Putra Mosque, Putrajaya
      syuruk: 'https://images.unsplash.com/photo-1508009603885-50cf7c579365?auto=format&fit=crop&w=1920&q=80',  // Golden hour over Sultan Salahuddin Abdul Aziz Mosque (Blue Mosque)
      zohor: 'https://images.unsplash.com/photo-1590001155093-a3c66ab0c3ff?auto=format&fit=crop&w=1920&q=80',   // Midday view of Federal Territory Mosque
      asar: 'https://images.unsplash.com/photo-1541086095944-f4b5412d3666?auto=format&fit=crop&w=1920&q=80',    // Soft afternoon light at Tuanku Mizan Zainal Abidin Mosque (Iron Mosque)
      maghrib: 'https://images.unsplash.com/photo-1609949279531-cf48d64bed89?auto=format&fit=crop&w=1920&q=80', // Majestic sunset at Malacca Straits Floating Mosque
      isyak: 'https://images.unsplash.com/photo-1565689157206-0fddef7589a2?auto=format&fit=crop&w=1920&q=80'    // Beautiful illuminated Kota Kinabalu City Mosque at night
    };

    let currentPrayerSlot = '';

    function updatePrayerBackground(activeSlot) {
      if (currentPrayerSlot !== activeSlot && prayerBackgrounds[activeSlot]) {
        currentPrayerSlot = activeSlot;
        document.getElementById('bg-carousel').style.backgroundImage = `url('${prayerBackgrounds[activeSlot]}')`;
      }
    }

    // Fetch Daily Quranic Verse
    async function fetchDailyQuran() {
      try {
        const now = new Date();
        const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
        const verseNumber = (dayOfYear * 17) % 6236 + 1; 

        const arRes = await fetch(`https://api.alquran.cloud/v1/ayah/${verseNumber}/ar.alafasy`);
        const arData = await arRes.json();

        const enRes = await fetch(`https://api.alquran.cloud/v1/ayah/${verseNumber}/en.sahih`);
        const enData = await enRes.json();

        if (arData.code === 200 && enData.code === 200) {
          document.getElementById('quran-ar').innerText = arData.data.text;
          document.getElementById('quran-en').innerText = `"${enData.data.text}" — Surah ${enData.data.surah.englishName} (${enData.data.surah.number}:${enData.data.numberInSurah})`;
        }
      } catch (err) {
        document.getElementById('quran-ar').innerText = "الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ اللَّهِ ۗ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ";
        document.getElementById('quran-en').innerText = "\"Those who believe and whose hearts find rest in the remembrance of Allah.\" — Surah Ar-Ra'd 13:28";
      }
    }

    // Fetch Daily Sahih Hadith
    async function fetchDailyHadith() {
      try {
        const res = await fetch(`https://random-hadith-generator.vercel.app/bukhari/`);
        const data = await res.json();

        if (data && data.data) {
          document.getElementById('hadith-ar').innerText = data.data.hadithArabic || "قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ...";
          document.getElementById('hadith-en').innerText = `"${data.data.hadithEnglish}" — ${data.data.refno || 'Sahih Bukhari'}`;
        }
      } catch (err) {
        document.getElementById('hadith-ar').innerText = "مَنْ طَهَّرَ فِي بَيْتِهِ ثُمَّ مَشَى إِلَى بَيْتٍ مِنْ بُيُوتِ اللَّهِ لِيَقْضِيَ فَرِيضَةً كَانَتْ خُطُوَاتُهُ إِحْدَاهُمَا تَحُطُّ خَطِيئَةً وَالأُخْرَى تَرْفَعُ دَرَجَةً";
        document.getElementById('hadith-en').innerText = "\"He who purifies himself in his house and then walks to a house of Allah to perform an obligatory prayer, one step wipes away a sin and the other raises his status.\" — Sahih Muslim 666";
      }
    }

    const prayerTimesToday = {
      subuh: "05:52",
      syuruk: "07:03",
      zohor: "13:15",
      asar: "16:21",
      maghrib: "19:20",
      isyak: "20:29"
    };

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', { hour12: true });

      const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
      document.getElementById('gregorian-date').innerText = now.toLocaleDateString('en-US', options);

      try {
        document.getElementById('hijri-date').innerText = new Intl.DateTimeFormat('en-TN-u-ca-islamic', {
          day: 'numeric', month: 'long', year: 'numeric'
        }).format(now) + "H";
      } catch (e) {
        document.getElementById('hijri-date').innerText = "";
      }

      updateCountdown(now);
    }

    function updateCountdown(now) {
      const times = [
        { key: "subuh", name: "Subuh", time: prayerTimesToday.subuh, rowId: "row-subuh" },
        { key: "syuruk", name: "Syuruk", time: prayerTimesToday.syuruk, rowId: "row-syuruk" },
        { key: "zohor", name: "Zohor", time: prayerTimesToday.zohor, rowId: "row-zohor" },
        { key: "asar", name: "Asar", time: prayerTimesToday.asar, rowId: "row-asar" },
        { key: "maghrib", name: "Maghrib", time: prayerTimesToday.maghrib, rowId: "row-maghrib" },
        { key: "isyak", name: "Isyak", time: prayerTimesToday.isyak, rowId: "row-isyak" }
      ];

      times.forEach(t => document.getElementById(t.rowId)?.classList.remove('active'));

      let nextPrayer = null;
      let nextPrayerTime = null;
      let activeSlot = 'isyak';

      for (let i = 0; i < times.length; i++) {
        const p = times[i];
        const [hours, minutes] = p.time.split(':');
        const pDate = new Date(now);
        pDate.setHours(parseInt(hours), parseInt(minutes), 0, 0);

        if (pDate > now) {
          nextPrayer = p.name;
          nextPrayerTime = pDate;
          document.getElementById(p.rowId)?.classList.add('active');
          activeSlot = i > 0 ? times[i - 1].key : 'isyak';
          break;
        }
      }

      if (!nextPrayer) {
        nextPrayer = "Subuh";
        const [hours, minutes] = prayerTimesToday.subuh.split(':');
        nextPrayerTime = new Date(now);
        nextPrayerTime.setDate(nextPrayerTime.getDate() + 1);
        nextPrayerTime.setHours(parseInt(hours), parseInt(minutes), 0, 0);
        document.getElementById("row-subuh")?.classList.add('active');
        activeSlot = 'isyak';
      }

      // Update background picture based on active prayer time slot
      updatePrayerBackground(activeSlot);

      document.getElementById('next-prayer-name').innerText = nextPrayer;

      const diffMs = nextPrayerTime - now;
      const hrs = Math.floor(diffMs / (1000 * 60 * 60));
      const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
      const secs = Math.floor((diffMs % (1000 * 60)) / 1000);

      document.getElementById('countdown').innerText = 
        `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    // Initialize
    fetchDailyQuran();
    fetchDailyHadith();
    updateClock();

    setInterval(updateClock, 1000);
  </script>
</body>
</html>
