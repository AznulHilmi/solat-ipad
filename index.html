<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Solat Saya</title>
  <style>
    :root {
      /* Reduced opacity for clear background images */
      --bg-gradient: linear-gradient(135deg, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.65) 100%);
      --accent-green: #2ecc71;
      --accent-amber: #f39c12;
      --accent-red: #e74c3c;
      --text-main: #FFFFFF;
      --text-sub: #e0e0e0;
      --panel-bg: rgba(20, 20, 20, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      background-color: #000;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 1.5s ease-in-out;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }

    /* Address Bar at Top */
    .address-bar {
      width: 100%;
      padding: 12px 20px;
      background-color: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.15);
      position: fixed;
      top: 0;
      z-index: 100;
    }
    .address-info { text-align: left; }
    .address-bar p {
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .address-bar span {
      display: block;
      color: var(--text-sub);
      font-size: 0.8rem;
      margin-top: 2px;
    }

    /* Audio Toggle Button */
    .audio-btn {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: all 0.3s ease;
      text-shadow: none;
    }
    .audio-btn.enabled {
      background: var(--accent-green);
      color: #000;
      border-color: var(--accent-green);
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
    }

    /* Main Container */
    .main-container {
      flex: 1;
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 75px;
      padding: 20px;
    }

    /* Countdown Panel */
    .countdown-panel {
      width: 100%;
      background-color: rgba(15, 15, 15, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.2);
      animation: pulse 10s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 12px rgba(46, 204, 113, 0.3); }
      50% { box-shadow: 0 0 25px rgba(46, 204, 113, 0.6); }
    }
    .countdown-label { font-size: 0.85rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; font-weight: 500; }
    .countdown-timer { font-size: 2.6rem; font-weight: 800; color: var(--accent-green); margin: 5px 0; font-variant-numeric: tabular-nums; }
    .countdown-timer.imminent { color: var(--accent-red); animation: blink 1s step-end infinite; }
    
    /* Rapid Flashing Effect When Prayer Arrives */
    .countdown-timer.solat-now { 
      color: #fff; 
      animation: flash-now 0.6s infinite alternate; 
    }
    @keyframes flash-now { 
      0% { color: var(--accent-green); text-shadow: 0 0 10px var(--accent-green); } 
      100% { color: #ffffff; text-shadow: 0 0 25px var(--accent-green); } 
    }

    @keyframes blink { 50% { opacity: 0.7; } }

    /* Solat List Panel */
    .card {
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.15);
    }
    
    .select-container { margin-bottom: 20px; text-align: center; }
    select {
      background: rgba(35, 35, 35, 0.9);
      color: #FFF;
      border: 1px solid #555;
      padding: 10px 12px;
      font-size: 1rem;
      border-radius: 8px;
      width: 100%;
      outline: none;
      -webkit-appearance: none;
    }
    
    .prayer-row {
      display: flex;
      justify-content: space-between;
      padding: 14px 16px;
      margin-bottom: 10px;
      border-radius: 8px;
      background: var(--panel-bg);
      font-size: 1.15rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
    }
    
    .prayer-row.active {
      background-color: rgba(46, 204, 113, 0.25);
      border-left: 5px solid var(--accent-green);
      transform: scale(1.03);
    }
    .prayer-row.active::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
      animation: shine 3s infinite;
    }
    @keyframes shine { 100% { transform: translateX(100%); } }

    .prayer-row.dhuha { border-left: 5px solid var(--accent-amber); background-color: rgba(243, 156, 18, 0.15); }
    .prayer-row.active.dhuha { border-left: 5px solid var(--accent-amber); background-color: rgba(243, 156, 18, 0.3); }
    
    .prayer-name { font-weight: 600; }
    .prayer-time { color: var(--text-main); font-weight: 700; }

    .error-box { background: #3E1010; color: #FF9999; padding: 12px; border-radius: 8px; font-size: 0.9rem; word-break: break-all; }
  </style>
</head>
<body>

  <!-- Address Bar -->
  <div class="address-bar">
    <div class="address-info">
      <p>NO. 8, JALAN SERENE 3/4, SERENE HEIGHTS</p>
      <span>43500 SEMENYIH, SELANGOR</span>
    </div>
    <button class="audio-btn" id="audio-toggle" onclick="toggleAudio()">🔊 Azan: OFF</button>
  </div>

  <div class="main-container">
    
    <!-- Countdown Panel -->
    <div class="countdown-panel">
      <div class="countdown-label" id="cd-label">Menjelang Solat</div>
      <div class="countdown-timer" id="cd-time">--:--:--</div>
    </div>

    <!-- Solat List -->
    <div class="card">
      <div class="select-container">
        <select id="zone-select" onchange="changeZone(this.value)">
          <option value="SGR01">Selangor / KL (SGR01)</option>
          <option value="WLY01">KL / Putrajaya (WLY01)</option>
          <option value="JHR02">Johor Bahru (JHR02)</option>
          <option value="PNG01">Pulau Pinang (PNG01)</option>
          <option value="PRK02">Ipoh / Perak Tengah (PRK02)</option>
          <option value="KDH01">Kota Setar / Kedah (KDH01)</option>
        </select>
      </div>
      
      <div id="prayer-list">
        <div class="prayer-row"><span class="prayer-name">Loading...</span></div>
      </div>
    </div>
  </div>

  <!-- Audio Element (Hosted Makkah Azan) -->
  <audio id="azan-player" preload="auto" src="https://cdn.islamic.network/audio/8000/1.mp3"></audio>

  <script>
    // --- BACKGROUND IMAGE ROTATION ---
    const backgroundImages = ['bg1.jpg', 'bg2.jpg', 'bg3.jpg'];
    let bgIndex = 0;

    function cycleBackground() {
      const imgName = backgroundImages[bgIndex];
      document.body.style.backgroundImage = `var(--bg-gradient), url('${imgName}')`;
      bgIndex = (bgIndex + 1) % backgroundImages.length;
    }
    cycleBackground();
    setInterval(cycleBackground, 15000); 

    // --- AZAN AUDIO HANDLING ---
    let audioEnabled = false;
    let azanPlayedForCurrentSolat = false;
    const azanAudio = document.getElementById('azan-player');

    function toggleAudio() {
      const btn = document.getElementById('audio-toggle');
      audioEnabled = !audioEnabled;
      
      if (audioEnabled) {
        azanAudio.play().then(() => {
          azanAudio.pause();
          azanAudio.currentTime = 0;
        }).catch(e => console.log("Audio unlock:", e));

        btn.innerText = "🔊 Azan: ON";
        btn.classList.add('enabled');
      } else {
        azanAudio.pause();
        azanAudio.currentTime = 0;
        btn.innerText = "🔊 Azan: OFF";
        btn.classList.remove('enabled');
      }
    }

    // --- TIME PARSING AND CONVERSION ---
    function parseToTodayDate(timeInput) {
      if (!timeInput) return null;
      let date = new Date();

      if (typeof timeInput === 'number') {
        let d = new Date(timeInput * 1000);
        date.setHours(d.getHours(), d.getMinutes(), 0, 0);
        return date;
      }

      if (typeof timeInput === 'string') {
        let parts = timeInput.trim().split(':');
        if (parts.length >= 2) {
          let h = parseInt(parts[0], 10);
          let m = parseInt(parts[1], 10);
          if (!isNaN(h) && !isNaN(m)) {
            date.setHours(h, m, 0, 0);
            return date;
          }
        }
      }
      return null;
    }

    function formatTime12h(dateObj) {
      if (!dateObj) return "--:--";
      let h = dateObj.getHours();
      let m = dateObj.getMinutes();
      let ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${h}:${m < 10 ? '0' : ''}${m} ${ampm}`;
    }

    function addMinutesToDate(dateObj, minsToAdd) {
      if (!dateObj) return null;
      let newDate = new Date(dateObj.getTime());
      newDate.setMinutes(newDate.getMinutes() + minsToAdd);
      return newDate;
    }

    // --- DYNAMIC DHUHA CALCULATION FORMULA ---
    // Formula: Syuruk + (1/3 of the time difference between Subuh and Syuruk)
    function calculateDhuha(subuhDate, syurukDate) {
      if (!subuhDate || !syurukDate) return null;
      let diffMinutes = (syurukDate.getTime() - subuhDate.getTime()) / (1000 * 60);
      let dhuhaOffset = Math.round(diffMinutes / 3);
      return addMinutesToDate(syurukDate, dhuhaOffset);
    }

    // --- DATA FETCHING ---
    let globalPrayerTimes = null;

    async function fetchPrayerTimes(zone) {
      document.getElementById('prayer-list').innerHTML = `<div class="prayer-row"><span class="prayer-name">Fetching times...</span></div>`;
      
      try {
        const res = await fetch(`https://api.waktusolat.app/v2/solat/${zone}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        let p = data.prayers ? data.prayers[0] : (data.prayerTime ? data.prayerTime[0] : null);
        if (!p) throw new Error("Invalid structure");

        let subuh = parseToTodayDate(p.fajr || p.subuh);
        let syuruk = parseToTodayDate(p.syuruk);

        globalPrayerTimes = {
          Subuh: subuh,
          Syuruk: syuruk,
          Dhuha: calculateDhuha(subuh, syuruk),
          Zohor: parseToTodayDate(p.dhuhr || p.zohor),
          Asar: parseToTodayDate(p.asr || p.asar),
          Maghrib: parseToTodayDate(p.maghrib),
          Isyak: parseToTodayDate(p.isha || p.isyak)
        };
        renderTimesList();
        updateLiveStatus();
        return;
      } catch (e1) {
        console.warn("Primary API failed, trying CORS proxy...", e1);
      }

      try {
        const proxyUrl = `https://api.allorigins.win/raw?url=` + encodeURIComponent(`https://api.waktusolat.app/v2/solat/${zone}`);
        const res = await fetch(proxyUrl);
        if (!res.ok) throw new Error(`Proxy HTTP ${res.status}`);
        const data = await res.json();
        let p = data.prayers ? data.prayers[0] : data.prayerTime[0];

        let subuh = parseToTodayDate(p.fajr || p.subuh);
        let syuruk = parseToTodayDate(p.syuruk);

        globalPrayerTimes = {
          Subuh: subuh,
          Syuruk: syuruk,
          Dhuha: calculateDhuha(subuh, syuruk),
          Zohor: parseToTodayDate(p.dhuhr || p.zohor),
          Asar: parseToTodayDate(p.asar || p.asar),
          Maghrib: parseToTodayDate(p.maghrib),
          Isyak: parseToTodayDate(p.isha || p.isyak)
        };
        renderTimesList();
        updateLiveStatus();
        return;
      } catch (e2) {
        console.warn("Proxy failed, trying MPT v2 prayer endpoint...", e2);
      }

      try {
        const res = await fetch(`https://mpt.i906.my/api/prayer/${zone}`);
        if (!res.ok) throw new Error(`MPT HTTP ${res.status}`);
        const data = await res.json();
        const times = data.data.times[0];

        let subuh = parseToTodayDate(times[1]);
        let syuruk = parseToTodayDate(times[2]);

        globalPrayerTimes = {
          Subuh: subuh,
          Syuruk: syuruk,
          Dhuha: calculateDhuha(subuh, syuruk),
          Zohor: parseToTodayDate(times[3]),
          Asar: parseToTodayDate(times[4]),
          Maghrib: parseToTodayDate(times[5]),
          Isyak: parseToTodayDate(times[6])
        };
        renderTimesList();
        updateLiveStatus();
      } catch (e3) {
        document.getElementById('prayer-list').innerHTML = `
          <div class="error-box">
            Connection Error. Unable to fetch prayer times.<br>
            <small>Details: ${e3.message}</small>
          </div>`;
      }
    }

    // --- INTERFACE RENDERING ---
    function renderTimesList() {
      if (!globalPrayerTimes) return;
      const p = globalPrayerTimes;
      const listHtml = `
        <div class="prayer-row" id="row-Subuh"><span class="prayer-name">Subuh</span><span class="prayer-time">${formatTime12h(p.Subuh)}</span></div>
        <div class="prayer-row" id="row-Syuruk"><span class="prayer-name">Syuruk</span><span class="prayer-time">${formatTime12h(p.Syuruk)}</span></div>
        <div class="prayer-row dhuha" id="row-Dhuha"><span class="prayer-name">Dhuha</span><span class="prayer-time">${formatTime12h(p.Dhuha)}</span></div>
        <div class="prayer-row" id="row-Zohor"><span class="prayer-name">Zohor</span><span class="prayer-time">${formatTime12h(p.Zohor)}</span></div>
        <div class="prayer-row" id="row-Asar"><span class="prayer-name">Asar</span><span class="prayer-time">${formatTime12h(p.Asar)}</span></div>
        <div class="prayer-row" id="row-Maghrib"><span class="prayer-name">Maghrib</span><span class="prayer-time">${formatTime12h(p.Maghrib)}</span></div>
        <div class="prayer-row" id="row-Isyak"><span class="prayer-name">Isyak</span><span class="prayer-time">${formatTime12h(p.Isyak)}</span></div>
      `;
      document.getElementById('prayer-list').innerHTML = listHtml;
    }

    // --- LIVE COUNTDOWN & HIGHLIGHT LOOP ---
    let lastPrayerName = '';

    function updateLiveStatus() {
      if (!globalPrayerTimes || !globalPrayerTimes.Subuh) return;

      const now = new Date();
      const p = globalPrayerTimes;
      
      document.querySelectorAll('.prayer-row').forEach(row => row.classList.remove('active'));

      let nextPrayerName = '';
      let nextPrayerTarget = null;
      let activePrayerName = '';

      if (now >= p.Isyak || now < p.Subuh) {
        activePrayerName = 'Isyak';
        nextPrayerName = 'Subuh';
        nextPrayerTarget = new Date(p.Subuh.getTime());
        if (now >= p.Isyak) {
          nextPrayerTarget.setDate(nextPrayerTarget.getDate() + 1);
        }
      } else if (now < p.Syuruk) { activePrayerName = 'Subuh'; nextPrayerName = 'Syuruk'; nextPrayerTarget = p.Syuruk; }
      else if (now < p.Dhuha) { activePrayerName = 'Syuruk'; nextPrayerName = 'Dhuha'; nextPrayerTarget = p.Dhuha; }
      else if (now < p.Zohor) { activePrayerName = 'Dhuha'; nextPrayerName = 'Zohor'; nextPrayerTarget = p.Zohor; }
      else if (now < p.Asar) { activePrayerName = 'Zohor'; nextPrayerName = 'Asar'; nextPrayerTarget = p.Asar; }
      else if (now < p.Maghrib) { activePrayerName = 'Asar'; nextPrayerName = 'Maghrib'; nextPrayerTarget = p.Maghrib; }
      else { activePrayerName = 'Maghrib'; nextPrayerName = 'Isyak'; nextPrayerTarget = p.Isyak; }

      if (activePrayerName !== lastPrayerName) {
        azanPlayedForCurrentSolat = false;
        lastPrayerName = activePrayerName;
      }

      const activeRow = document.getElementById(`row-${activePrayerName}`);
      if (activeRow) activeRow.classList.add('active');

      const labelEl = document.getElementById('cd-label');
      const timeEl = document.getElementById('cd-time');
      
      labelEl.innerText = `Menjelang ${nextPrayerName}`;
      
      let diffSeconds = Math.floor((nextPrayerTarget.getTime() - now.getTime()) / 1000);
      if (diffSeconds < 0) diffSeconds = 0;

      let h = Math.floor(diffSeconds / 3600);
      let m = Math.floor((diffSeconds % 3600) / 60);
      let s = Math.floor(diffSeconds % 60);

      timeEl.innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

      timeEl.classList.remove('imminent', 'solat-now');
      
      if (diffSeconds === 0) {
        timeEl.classList.add('solat-now');
        labelEl.innerText = `MASUK WAKTU ${nextPrayerName.toUpperCase()}`;

        if (audioEnabled && !azanPlayedForCurrentSolat && nextPrayerName !== 'Syuruk' && nextPrayerName !== 'Dhuha') {
          azanPlayedForCurrentSolat = true;
          azanAudio.currentTime = 0;
          azanAudio.play().catch(e => console.error("Azan playback blocked:", e));
        }
      } else if (diffSeconds <= 600) {
        timeEl.classList.add('imminent');
      }
    }

    // --- INITIALIZATION ---
    function changeZone(newZone) {
      localStorage.setItem('selectedZone_v4', newZone);
      fetchPrayerTimes(newZone);
    }

    const savedZone = localStorage.getItem('selectedZone_v4') || 'SGR01';
    document.getElementById('zone-select').value = savedZone;
    fetchPrayerTimes(savedZone);

    setInterval(updateLiveStatus, 1000);
  </script>
</body>
</html>
