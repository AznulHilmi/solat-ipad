<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <!-- Viewport settings to lock zoom and prevent scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Legacy iOS Web App Standalone Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Waktu Solat">

  <title>Paparan Waktu Solat</title>

  <style>
    /* Color Palette */
    :root {
      --bg-color: #0d1b2a;
      --card-bg: #1b263b;
      --text-main: #e0e1dd;
      --accent: #00b4d8;
      --highlight: #ffb703;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header Section (Covers Top iOS Safe Area) */
    .header {
      padding-top: env(safe-area-inset-top, 20px);
      padding-bottom: 10px;
      padding-left: 20px;
      padding-right: 20px;
      background-color: var(--bg-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .time-container {
      display: flex;
      flex-direction: column;
    }

    .clock {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: -1px;
      color: #ffffff;
      line-height: 1;
    }

    .date-gregorian {
      font-size: 1rem;
      color: #778da9;
      margin-top: 4px;
    }

    .hijri-container {
      text-align: right;
    }

    .hijri-date {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--accent);
    }

    .zone-label {
      font-size: 0.85rem;
      color: #778da9;
      margin-top: 2px;
    }

    /* Main Grid for Solat Cards */
    .grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 15px;
      padding: 15px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border: 2px solid transparent;
      transition: all 0.3s ease;
    }

    .card.active {
      border-color: var(--highlight);
      background-color: #2a3d56;
      box-shadow: 0 0 15px rgba(255, 183, 3, 0.3);
    }

    .card-name {
      font-size: 1.2rem;
      color: #778da9;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card-time {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      margin-top: 5px;
    }

    .card.active .card-name {
      color: var(--highlight);
    }

    .card.active .card-time {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Top Header Section -->
  <div class="header">
    <div class="time-container">
      <div id="clock" class="clock">00:00:00</div>
      <div id="gregorian-date" class="date-gregorian">Memuatkan...</div>
    </div>
    <div class="hijri-container">
      <div id="hijri-date" class="hijri-date">Memuatkan...</div>
      <div id="zone-display" class="zone-label">Kuala Lumpur / Putrajaya (WLY01)</div>
    </div>
  </div>

  <!-- Waktu Solat Display Grid -->
  <div class="grid">
    <div class="card" id="card-subuh">
      <div class="card-name">Subuh</div>
      <div class="card-time" id="time-subuh">--:--</div>
    </div>
    <div class="card" id="card-syuruk">
      <div class="card-name">Syuruk</div>
      <div class="card-time" id="time-syuruk">--:--</div>
    </div>
    <div class="card" id="card-zohor">
      <div class="card-name">Zohor</div>
      <div class="card-time" id="time-zohor">--:--</div>
    </div>
    <div class="card" id="card-asar">
      <div class="card-name">Asar</div>
      <div class="card-time" id="time-asar">--:--</div>
    </div>
    <div class="card" id="card-maghrib">
      <div class="card-name">Maghrib</div>
      <div class="card-time" id="time-maghrib">--:--</div>
    </div>
    <div class="card" id="card-isyak">
      <div class="card-name">Isyak</div>
      <div class="card-time" id="time-isyak">--:--</div>
    </div>
  </div>

  <script>
    // Configuration: Set your JAKIM Zone Code (e.g., WLY01 for KL, SGR01 for Selangor)
    const JAKIM_ZONE = "WLY01";

    // Standard JAKIM Malay Month Transliterations
    const jakimMonths = [
      "Muharram", "Safar", "Rabiulawal", "Rabiulakhir",
      "Jamadilawal", "Jamadilakhir", "Rejab", "Syaaban",
      "Ramadan", "Syawal", "Zulkaedah", "Zulhijjah"
    ];

    let solatTimesToday = null;

    // 1. Digital Clock & Gregorian Date Handler
    function updateClock() {
      const now = new Date();
      
      // Update Digital Clock (HH:MM:SS)
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}`;

      // Update Gregorian Date Format
      const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
      document.getElementById('gregorian-date').innerText = now.toLocaleDateString('ms-MY', options);

      // Check current active solat period if timings exist
      if (solatTimesToday) {
        highlightActiveSolat(now, solatTimesToday);
      }
    }

    // 2. Offline JAKIM Hijri Date Formatter (Fallback)
    function getMalaysianHijriDate(date = new Date()) {
      try {
        const formatter = new Intl.DateTimeFormat('en-TN-u-ca-islamic-umalqura', {
          day: 'numeric',
          month: 'numeric',
          year: 'numeric'
        });

        const parts = formatter.formatToParts(date);
        let day, monthIndex, year;

        parts.forEach(part => {
          if (part.type === 'day') day = part.value;
          if (part.type === 'month') monthIndex = parseInt(part.value, 10) - 1;
          if (part.type === 'year') year = part.value;
        });

        return `${day} ${jakimMonths[monthIndex]} ${year} H`;
      } catch (e) {
        return "";
      }
    }

    // 3. Fetch Official JAKIM Data (Waktu Solat + Hijri Date)
    function fetchSolatData() {
      fetch(`https://api.waktusolat.app/v2/solat/${JAKIM_ZONE}`)
        .then(response => response.json())
        .then(data => {
          const now = new Date();
          const todayEpoch = Math.floor(new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime() / 1000);
          
          // Find today's prayer schedule entry
          const todayData = data.prayers.find(p => p.day === now.getDate()) || data.prayers[0];

          if (todayData) {
            solatTimesToday = todayData;
            
            // Format and update Solat display times
            document.getElementById('time-subuh').innerText = formatTimestamp(todayData.fajr);
            document.getElementById('time-syuruk').innerText = formatTimestamp(todayData.syuruk);
            document.getElementById('time-zohor').innerText = formatTimestamp(todayData.dhuhr);
            document.getElementById('time-asar').innerText = formatTimestamp(todayData.asr);
            document.getElementById('time-maghrib').innerText = formatTimestamp(todayData.maghrib);
            document.getElementById('time-isyak').innerText = formatTimestamp(todayData.isha);

            // Update Hijri Date string from JAKIM API or Fallback
            if (todayData.hijri) {
              // Clean any accidental duplicate 'AH' or trailing strings
              let cleanHijri = todayData.hijri.replace(/(AH\s*)+$/i, '').trim();
              if (!cleanHijri.endsWith('H')) cleanHijri += ' H';
              document.getElementById('hijri-date').innerText = cleanHijri;
            } else {
              document.getElementById('hijri-date').innerText = getMalaysianHijriDate();
            }
          }
        })
        .catch(err => {
          console.error("Gagal mengambil data JAKIM, menggunakan modul offline:", err);
          document.getElementById('hijri-date').innerText = getMalaysianHijriDate();
        });
    }

    // Convert API epoch timestamps to 12-hour AM/PM display
    function formatTimestamp(epochSeconds) {
      const date = new Date(epochSeconds * 1000);
      let hours = date.getHours();
      const minutes = String(date.getMinutes()).padStart(2, '0');
      hours = hours % 12 || 12; // 12-hour format
      return `${String(hours).padStart(2, '0')}:${minutes}`;
    }

    // Highlight the upcoming/current active prayer card
    function highlightActiveSolat(now, times) {
      const currentEpoch = Math.floor(now.getTime() / 1000);
      const cards = ['subuh', 'syuruk', 'zohor', 'asar', 'maghrib', 'isyak'];
      
      // Clear previous active states
      cards.forEach(c => document.getElementById(`card-${c}`).classList.remove('active'));

      if (currentEpoch >= times.fajr && currentEpoch < times.syuruk) {
        document.getElementById('card-subuh').classList.add('active');
      } else if (currentEpoch >= times.syuruk && currentEpoch < times.dhuhr) {
        document.getElementById('card-syuruk').classList.add('active');
      } else if (currentEpoch >= times.dhuhr && currentEpoch < times.asr) {
        document.getElementById('card-zohor').classList.add('active');
      } else if (currentEpoch >= times.asr && currentEpoch < times.maghrib) {
        document.getElementById('card-asar').classList.add('active');
      } else if (currentEpoch >= times.maghrib && currentEpoch < times.isha) {
        document.getElementById('card-maghrib').classList.add('active');
      } else {
        document.getElementById('card-isyak').classList.add('active');
      }
    }

    // Initialization & Intervals
    setInterval(updateClock, 1000);
    updateClock();
    fetchSolatData();

    // Refresh prayer schedule automatically every 6 hours
    setInterval(fetchSolatData, 6 * 60 * 60 * 1000);
  </script>
</body>
</html>
