<script>
  var prayerTimesToday = {
    subuh: "05:59",
    syuruk: "07:05",
    dhuha: "07:33",
    zohor: "13:14",
    asar: "16:18",
    maghrib: "19:18",
    isyak: "20:27"
  };

  var jakimMonths = [
    "Muharram", "Safar", "Rabiulawal", "Rabiulakhir",
    "Jamadilawal", "Jamadilakhir", "Rejab", "Syaaban",
    "Ramadan", "Syawal", "Zulkaedah", "Zulhijjah"
  ];

  var cachedHijriString = "";

  // Helper: "HH:MM:SS" or "HH:MM" -> "HH:MM" (24h)
  function normalizeHHMM(timeStr) {
    if (!timeStr) return null;
    var parts = timeStr.trim().split(':');
    if (parts.length < 2) return null;
    var hh = parts[0].padStart(2, '0');
    var mm = parts[1].padStart(2, '0');
    return hh + ':' + mm;
  }

  // Helper: "HH:MM" (24h) -> minutes since midnight
  function toMinutes(hhmm) {
    var parts = hhmm.split(':');
    return parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
  }

  // Helper: minutes since midnight -> "HH:MM" (24h)
  function fromMinutes(totalMins) {
    var wrapped = ((totalMins % 1440) + 1440) % 1440;
    var hh = Math.floor(wrapped / 60);
    var mm = wrapped % 60;
    return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
  }

  // Helper: "HH:MM" (24h) -> "hh:mm AM/PM"
  function formatTo12Hour(hhmm) {
    var parts = hhmm.split(':');
    var hour24 = parseInt(parts[0], 10);
    var minute = parts[1];
    var period = hour24 >= 12 ? 'PM' : 'AM';
    var hour12 = hour24 % 12;
    if (hour12 === 0) hour12 = 12;
    return String(hour12).padStart(2, '0') + ':' + minute + ' ' + period;
  }

  // Update the visible prayer time labels on screen
  function renderPrayerTimeTable() {
    var keys = ["subuh", "syuruk", "dhuha", "zohor", "asar", "maghrib", "isyak"];
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      var el = document.getElementById('time-' + k);
      if (el && prayerTimesToday[k]) {
        el.innerText = formatTo12Hour(prayerTimesToday[k]);
      }
    }
  }

  // Fetch today's solat times for JAKIM Zone SGR01
  async function fetchMalaysianPrayerTimes() {
    try {
      var now = new Date();
      var yyyy = now.getFullYear();
      var mm = String(now.getMonth() + 1).padStart(2, '0');
      var dd = String(now.getDate()).padStart(2, '0');
      var todayStr = yyyy + '-' + mm + '-' + dd;

      var url = 'https://www.e-solat.gov.my/index.php?r=esolatApi/takwimsolat&period=today&zone=SGR01';
      var response = await fetch(url);
      var data = await response.json();

      if (data && data.prayerTime && data.prayerTime.length > 0) {
        var pt = data.prayerTime[0];
        var subuh = normalizeHHMM(pt.fajr);
        var syuruk = normalizeHHMM(pt.syuruk);
        var zohor = normalizeHHMM(pt.dhuhr);
        var asar = normalizeHHMM(pt.asr);
        var maghrib = normalizeHHMM(pt.maghrib);
        var isyak = normalizeHHMM(pt.isha);

        if (subuh) prayerTimesToday.subuh = subuh;
        if (syuruk) {
          prayerTimesToday.syuruk = syuruk;
          // Dhuha ~28 minutes after Syuruk
          prayerTimesToday.dhuha = fromMinutes(toMinutes(syuruk) + 28);
        }
        if (zohor) prayerTimesToday.zohor = zohor;
        if (asar) prayerTimesToday.asar = asar;
        if (maghrib) prayerTimesToday.maghrib = maghrib;
        if (isyak) prayerTimesToday.isyak = isyak;

        renderPrayerTimeTable();
      }
    } catch (err) {
      console.warn("Failed to fetch JAKIM SGR01 prayer times:", err);
    }
  }

  // Automatically fetch live Hijri date from Malaysia's e-Solat API
  async function fetchMalaysianHijriDate() {
    try {
      var now = new Date();
      var yyyy = now.getFullYear();
      var mm = String(now.getMonth() + 1).padStart(2, '0');
      var dd = String(now.getDate()).padStart(2, '0');
      var todayStr = yyyy + '-' + mm + '-' + dd;

      var response = await fetch('https://www.e-solat.gov.my/index.php?r=esolatApi%2Ftarikhtakwim&period=today&datetype=miladi&date=' + todayStr);
      var data = await response.json();

      if (data && data.takwim && data.takwim[todayStr]) {
        var parts = data.takwim[todayStr].split('-');
        if (parts.length === 3) {
          var hYear = parts[0];
          var hMonthNum = parseInt(parts[1], 10);
          var hDay = parseInt(parts[2], 10);

          var monthWord = (hMonthNum >= 1 && hMonthNum <= 12) ? jakimMonths[hMonthNum - 1] : hMonthNum;
          cachedHijriString = hDay + " " + monthWord + " " + hYear + " H";
        }
      }
    } catch (err) {
      console.warn("API fetch failed, utilizing fallback calculation:", err);
    }

    if (!cachedHijriString) {
      var date = new Date();
      var jd = Math.floor((date.getTime() / 86400000) + 2440587.5) + 2;
      var l = jd - 1948440 + 10632;
      var n = Math.floor((l - 1) / 10631);
      l = l - n * 10631 + 354;
      var j = (Math.floor((10985 - l) / 5316)) * (Math.floor((50 * l) / 17719)) + (Math.floor(l / 5670)) * (Math.floor((43 * l) / 15238));
      l = l - (Math.floor((30 - j) / 15)) * (Math.floor((17719 * j) / 50)) - (Math.floor(j / 16)) * (Math.floor((15238 * j) / 43)) + 29;
      var hMonth = Math.floor((24 * l) / 709);
      var hDay = l - Math.floor((709 * hMonth) / 24);
      var hYear = Math.floor(30 * n + j - 30);
      var monthWord = (hMonth >= 1 && hMonth <= 12) ? jakimMonths[hMonth - 1] : "Muharram";
      cachedHijriString = hDay + " " + monthWord + " " + hYear + " H";
    }
  }

      en: "\"Barangsiapa solat Subuh berjemaah, kemudian duduk berzikir mengingati Allah hingga terbit matahari... dia mendapat pahala seperti haji dan umrah.\" — Tirmidzi (Sahih)"

      en: "\"Setiap sendi badan manusia diwajibkan bersedekah setiap pagi... dan memadai untuk semua itu dengan mengerjakan dua rakaat solat Dhuha.\" — Sahih Muslim"

    },
    maghrib: {

      en: "\"Umatku sentiasa berada dalam kebaikan selagi mana mereka tidak melewatkan solat Maghrib.\" — Abu Dawood (Sahih)"
    },
    isyak: {

      en: "\"Barangsiapa yang solat Isyak berjemaah, maka seolah-olah dia telah solat separuh malam.\" — Sahih Muslim"
    }
  };

  var quranCollection = {
    subuh: {
      ar: "وَقُرْآنَ الْفَجْرِ ۖ إِنَّ قُرْآنَ الْفَجْرِ كَانَ مَشْهُودًا",
      en: "\"Dan (dirikanlah pula) solat subuh. Sesungguhnya solat subuh itu adalah disaksikan (oleh malaikat).\" — Surah Al-Isra' 17:78"
    },
    syuruk: {
      ar: "وَسَبِّحْ بِحَمْدِ رَبِّكَ قَبْلَ طُلُوعِ الشَّمْسِ وَقَبْلَ غُرُوبِهَا",
      en: "\"Dan bertasbihlah dengan memuji Tuhanmu sebelum terbit matahari dan sebelum terbenamnya.\" — Surah Taha 20:130"
    },
    dhuha: {
      ar: "وَالضُّحَىٰ * وَاللَّيْلِ إِذَا سَجَىٰ",

    },
    asar: {

      en: "\"Demi Masa! Sesungguhnya manusia itu dalam kerugian.\" — Surah Al-Asr 103:1-2"
    },
    maghrib: {
      ar: "وَسَبِّحْ بِحَمْدِ رَبِّكَ قَبْلَ طُلُوعِ الشَّمْسِ وَقَبْلَ غُرُوبِهَا",
      en: "\"Dan bertasbihlah dengan memuji Tuhanmu sebelum terbit matahari dan sebelum terbenamnya.\" — Surah Qaf 50:39"
    },
    isyak: {
      ar: "تَتَجَافَىٰ جُنُوبُهُمْ عَنِ الْمَضَاجِعِ يَدْعُونَ رَبَّهُمْ خَوْفًا وَطَمَعًا",
      en: "\"Lambung mereka jauh dari tempat tidur, mereka berdoa kepada Tuhan mereka dengan rasa takut dan penuh harap.\" — Surah As-Sajdah 32:16"
    }
  };

  var currentActiveSceneryKey = "";

  function updateContent(currentPrayerKey) {
    if (currentPrayerKey !== currentActiveSceneryKey) {
      currentActiveSceneryKey = currentPrayerKey;

      var imageUrl = sceneryImages[currentPrayerKey] || sceneryImages.zohor;
      var bgDiv = document.getElementById('bg-scenery');
      if (bgDiv) {
        bgDiv.style.backgroundImage = "url('" + imageUrl + "')";
      }

      var hadithData = hadithCollection[currentPrayerKey] || hadithCollection.zohor;
      var hadithAr = document.getElementById('hadith-ar');
      var hadithEn = document.getElementById('hadith-en');
      if (hadithAr && hadithEn) {
        hadithAr.innerText = hadithData.ar;
        hadithEn.innerText = hadithData.en;
      }

      var quranData = quranCollection[currentPrayerKey] || quranCollection.zohor;
      var quranAr = document.getElementById('quran-ar');
      var quranEn = document.getElementById('quran-en');
      if (quranAr && quranEn) {
        quranAr.innerText = quranData.ar;
        quranEn.innerText = quranData.en;
      }
    }
  }

  function updateEngine() {
    try {
      var now = new Date();

      var clockElem = document.getElementById('clock');
      if (clockElem) {
        clockElem.innerText = now.toLocaleTimeString('en-US', { hour12: true });
      }

      var gregElem = document.getElementById('gregorian-date');
      if (gregElem) {
        gregElem.innerText = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
      }

      var hijriElem = document.getElementById('hijri-date');
      if (hijriElem) {
        hijriElem.innerText = cachedHijriString || "Loading Hijri...";
      }

      var times = [
        { key: "subuh", name: "Subuh", time: prayerTimesToday.subuh, rowId: "row-subuh" },
        { key: "syuruk", name: "Syuruk", time: prayerTimesToday.syuruk, rowId: "row-syuruk" },
        { key: "dhuha", name: "Dhuha", time: prayerTimesToday.dhuha, rowId: "row-dhuha" },
        { key: "zohor", name: "Zohor", time: prayerTimesToday.zohor, rowId: "row-zohor" },
        { key: "asar", name: "Asar", time: prayerTimesToday.asar, rowId: "row-asar" },
        { key: "maghrib", name: "Maghrib", time: prayerTimesToday.maghrib, rowId: "row-maghrib" },
        { key: "isyak", name: "Isyak", time: prayerTimesToday.isyak, rowId: "row-isyak" }
      ];

      for (var i = 0; i < times.length; i++) {
        var el = document.getElementById(times[i].rowId);
        if (el) el.classList.remove('active');
      }

      var nextPrayer = null;
      var nextPrayerTime = null;
      var activePrayerKey = "isyak";

      for (var j = 0; j < times.length; j++) {
        var p = times[j];
        if (!p.time) continue;
        var parts = p.time.split(':');
        var pDate = new Date(now.getTime());
        pDate.setHours(parseInt(parts[0], 10), parseInt(parts[1], 10), 0, 0);

        if (pDate > now) {
          nextPrayer = p.name;
          nextPrayerTime = pDate;
          var activeEl = document.getElementById(p.rowId);
          if (activeEl) activeEl.classList.add('active');

          var prevIdx = (j - 1 + times.length) % times.length;
          activePrayerKey = times[prevIdx].key;
          break;
        }
      }

      if (!nextPrayer) {
        nextPrayer = "Subuh";
        var subParts = prayerTimesToday.subuh.split(':');
        nextPrayerTime = new Date(now.getTime());
        nextPrayerTime.setDate(nextPrayerTime.getDate() + 1);
        nextPrayerTime.setHours(parseInt(subParts[0], 10), parseInt(subParts[1], 10), 0, 0);
        var subEl = document.getElementById("row-subuh");
        if (subEl) subEl.classList.add('active');
        activePrayerKey = "isyak";
      }

      updateContent(activePrayerKey);

      var nextLabel = document.getElementById('next-prayer-name');
      if (nextLabel) nextLabel.innerText = nextPrayer;

      var diffMs = Math.max(0, nextPrayerTime - now);
      var hrs = Math.floor(diffMs / (1000 * 60 * 60));
      var mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
      var secs = Math.floor((diffMs % (1000 * 60)) / 1000);

      var countElem = document.getElementById('countdown');
      if (countElem) {
        countElem.innerText =
          (hrs < 10 ? '0' + hrs : hrs) + ':' +
          (mins < 10 ? '0' + mins : mins) + ':' +
          (secs < 10 ? '0' + secs : secs);
      }

    } catch (err) {
      console.error("Main loop error caught:", err);
    }
  }

  // Initial render & API fetches
  renderPrayerTimeTable();
  fetchMalaysianPrayerTimes();
  fetchMalaysianHijriDate();

  // Refresh every hour
  setInterval(fetchMalaysianPrayerTimes, 3600000);
  setInterval(fetchMalaysianHijriDate, 3600000);

  updateEngine();
  setInterval(updateEngine, 1000);
</script>
