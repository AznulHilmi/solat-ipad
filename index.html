<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Solat Saya</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, rgba(18,18,18,0.85) 0%, rgba(30,30,30,0.95) 100%);
      --accent-green: #2ecc71;
      --accent-amber: #f39c12;
      --accent-red: #e74c3c;
      --text-main: #FFFFFF;
      --text-sub: #bdc3c7;
      --panel-bg: rgba(42, 42, 42, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      background-color: #000;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background-image 1.5s ease-in-out;
    }

    /* Address Bar at Top */
    .address-bar {
      width: 100%;
      padding: 15px 20px;
      background-color: rgba(0,0,0,0.6);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      position: fixed;
      top: 0;
      z-index: 100;
    }
    .address-bar p {
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .address-bar span {
      display: block;
      color: var(--text-sub);
      font-size: 0.8rem;
      margin-top: 2px;
    }

    /* Main Container with Margin for Fixed Header */
    .main-container {
      flex: 1;
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 75px;
      padding: 20px;
    }

    /* Countdown Panel */
    .countdown-panel {
      width: 100%;
      background-color: rgba(18, 18, 18, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.1);
      animation: pulse 10s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 10px rgba(46, 204, 113, 0.3); }
      50% { box-shadow: 0 0 25px rgba(46, 204, 113, 0.6); }
    }
    .countdown-label { font-size: 0.85rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; }
    .countdown-timer { font-size: 2.5rem; font-weight: 800; color: var(--accent-green); margin: 5px 0; font-variant-numeric: tabular-nums; }
    .countdown-timer.imminent { color: var(--accent-red); animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0.7; } }

    /* Solat List Panel */
    .card {
      background: rgba(30, 30, 30, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      border: 1px solid rgba(255,255,255,0.05);
    }
    
    .select-container { margin-bottom: 20px; text-align: center; }
    select {
      background: var(--panel-bg);
      color: #FFF;
      border: 1px solid #444;
      padding: 10px 12px;
      font-size: 1rem;
      border-radius: 8px;
      width: 100%;
      outline: none;
      -webkit-appearance: none;
    }
    
    .prayer-row {
      display: flex;
      justify-content: space-between;
      padding: 14px 16px;
      margin-bottom: 10px;
      border-radius: 8px;
      background: var(--panel-bg);
      font-size: 1.15rem;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    /* Highlight Active Prayer Row */
    .prayer-row.active {
      background-color: rgba(46, 204, 113, 0.2);
      border-left: 5px solid var(--accent-green);
      transform: scale(1.03);
    }
    .prayer-row.active::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      animation: shine 3s infinite;
    }
    @keyframes shine { 100% { transform: translateX(100%); } }

    .prayer-row.dhuha { border-left: 5px solid var(--accent-amber); background-color: rgba(243, 156, 18, 0.1); }
    .prayer-row.active.dhuha { border-left: 5px solid var(--accent-amber); background-color: rgba(243, 156, 18, 0.25); }
    
    .prayer-name { font-weight: 600; }
    .prayer-time { color: var(--text-main); font-weight: 700; }

    .error-box { background: #3E1010; color: #FF9999; padding: 12px; border-radius: 8px; font-size: 0.9rem; word-break: break-all; }
  </style>
</head>
<body>

  <!-- Address Bar -->
  <div class="address-bar">
    <p>RUMAH SAYA</p>
    <span>Subang Jaya, Selangor</span>
  </div>

  <div class="main-container">
    
    <!-- Countdown Panel -->
    <div class="countdown-panel">
      <div class="countdown-label" id="cd-label">Menjelang Solat</div>
      <div class="countdown-timer" id="cd-time">--:--:--</div>
    </div>

    <!-- Solat List -->
    <div class="card">
      <div class="select-container">
        <select id="zone-select" onchange="changeZone(this.value)">
          <option value="SGR01">Selangor / KL (SGR01)</option>
          <option value="WLY01">KL / Putrajaya (WLY01)</option>
          <option value="JHR02">Johor Bahru (JHR02)</option>
          <option value="PNG01">Pulau Pinang (PNG01)</option>
          <option value="PRK02">Ipoh / Perak Tengah (PRK02)</option>
          <option value="KDH01">Kota Setar / Kedah (KDH01)</option>
        </select>
      </div>
      
      <div id="prayer-list">
        <div class="prayer-row"><span class="prayer-name">Loading...</span></div>
      </div>
    </div>
  </div>

  <script>
    // --- BACKGROUND IMAGE ROTATION ---
    const backgroundImages = ['bg1.jpg', 'bg2.jpg', 'bg3.jpg'];
    let bgIndex = 0;

    function cycleBackground() {
      const imgName = backgroundImages[bgIndex];
      document.body.style.backgroundImage = `var(--bg-gradient), url('${imgName}')`;
      bgIndex = (bgIndex + 1) % backgroundImages.length;
    }
    cycleBackground();
    setInterval(cycleBackground, 15000); 

    // --- TIME PARSING & MATH ---
    function formatTime12h(unixTimestamp) {
      if (!unixTimestamp) return "--:--";
      let d = new Date(unixTimestamp * 1000);
      let h = d.getHours();
      let m = d.getMinutes();
      let ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${h}:${m < 10 ? '0' : ''}${m} ${ampm}`;
    }

    function addMinutes(unixTimestamp, minsToAdd) {
      return unixTimestamp + (minsToAdd * 60);
    }

    // --- MULTI-ENDPOINT DATA FETCHING ---
    let globalPrayerTimes = null;

    async function fetchPrayerTimes(zone) {
      document.getElementById('prayer-list').innerHTML = `<div class="prayer-row"><span class="prayer-name">Fetching times...</span></div>`;
      
      function toUnix(timeStr) {
        if (typeof timeStr === 'number') return timeStr;
        let [h, m] = timeStr.split(':').map(Number);
        let d = new Date();
        d.setHours(h, m, 0, 0);
        return Math.floor(d.getTime() / 1000);
      }

      // Endpoint 1: Primary API
      try {
        const res = await fetch(`https://api.waktusolat.app/v2/solat/${zone}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        let p = data.prayers ? data.prayers[0] : (data.prayerTime ? data.prayerTime[0] : null);
        if (!p) throw new Error("Invalid structure");

        let syuruk = toUnix(p.syuruk);
        globalPrayerTimes = {
          Subuh: toUnix(p.fajr || p.subuh),
          Syuruk: syuruk,
          Dhuha: addMinutes(syuruk, 28),
          Zohor: toUnix(p.dhuhr || p.zohor),
          Asar: toUnix(p.asr || p.asar),
          Maghrib: toUnix(p.maghrib),
          Isyak: toUnix(p.isha || p.isyak)
        };
        renderTimesList();
        return;
      } catch (e1) {
        console.warn("Primary API failed, trying CORS proxy...", e1);
      }

      // Endpoint 2: Proxy Fallback
      try {
        const proxyUrl = `https://api.allorigins.win/raw?url=` + encodeURIComponent(`https://api.waktusolat.app/v2/solat/${zone}`);
        const res = await fetch(proxyUrl);
        if (!res.ok) throw new Error(`Proxy HTTP ${res.status}`);
        const data = await res.json();
        let p = data.prayers ? data.prayers[0] : data.prayerTime[0];

        let syuruk = toUnix(p.syuruk);
        globalPrayerTimes = {
          Subuh: toUnix(p.fajr || p.subuh),
          Syuruk: syuruk,
          Dhuha: addMinutes(syuruk, 28),
          Zohor: toUnix(p.dhuhr || p.zohor),
          Asar: toUnix(p.asr || p.asar),
          Maghrib: toUnix(p.maghrib),
          Isyak: toUnix(p.isha || p.isyak)
        };
        renderTimesList();
        return;
      } catch (e2) {
        console.warn("Proxy failed, trying MPT v2 prayer endpoint...", e2);
      }

      // Endpoint 3: MPT Prayer API
      try {
        const res = await fetch(`https://mpt.i906.my/api/prayer/${zone}`);
        if (!res.ok) throw new Error(`MPT HTTP ${res.status}`);
        const data = await res.json();
        const times = data.data.times[0];

        globalPrayerTimes = {
          Subuh: times[1],
          Syuruk: times[2],
          Dhuha: addMinutes(times[2], 28),
          Zohor: times[3],
          Asar: times[4],
          Maghrib: times[5],
          Isyak: times[6]
        };
        renderTimesList();
      } catch (e3) {
        document.getElementById('prayer-list').innerHTML = `
          <div class="error-box">
            Connection Error. Unable to fetch prayer times.<br>
            <small>Details: ${e3.message}</small>
          </div>`;
      }
    }

    // --- INTERFACE RENDERING ---
    function renderTimesList() {
      if (!globalPrayerTimes) return;
      const p = globalPrayerTimes;
      const listHtml = `
        <div class="prayer-row" id="row-Subuh"><span class="prayer-name">Subuh</span><span class="prayer-time">${formatTime12h(p.Subuh)}</span></div>
        <div class="prayer-row" id="row-Syuruk"><span class="prayer-name">Syuruk</span><span class="prayer-time">${formatTime12h(p.Syuruk)}</span></div>
        <div class="prayer-row dhuha" id="row-Dhuha"><span class="prayer-name">Dhuha</span><span class="prayer-time">${formatTime12h(p.Dhuha)}</span></div>
        <div class="prayer-row" id="row-Zohor"><span class="prayer-name">Zohor</span><span class="prayer-time">${formatTime12h(p.Zohor)}</span></div>
        <div class="prayer-row" id="row-Asar"><span class="prayer-name">Asar</span><span class="prayer-time">${formatTime12h(p.Asar)}</span></div>
        <div class="prayer-row" id="row-Maghrib"><span class="prayer-name">Maghrib</span><span class="prayer-time">${formatTime12h(p.Maghrib)}</span></div>
        <div class="prayer-row" id="row-Isyak"><span class="prayer-name">Isyak</span><span class="prayer-time">${formatTime12h(p.Isyak)}</span></div>
      `;
      document.getElementById('prayer-list').innerHTML = listHtml;
    }

    // --- LIVE STATUS (HIGHLIGHTING & COUNTDOWN) ---
    function updateLiveStatus() {
      if (!globalPrayerTimes) return;

      const now = Math.floor(Date.now() / 1000);
      const p = globalPrayerTimes;
      
      document.querySelectorAll('.prayer-row').forEach(row => row.classList.remove('active'));

      let nextPrayerName = '';
      let nextPrayerTime = null;
      let activePrayerName = '';

      if (now >= p.Isyak || now < p.Subuh) {
        activePrayerName = 'Isyak';
        nextPrayerName = 'Subuh';
        nextPrayerTime = now >= p.Isyak ? p.Subuh + 86400 : p.Subuh;
      } else if (now < p.Syuruk) { activePrayerName = 'Subuh'; nextPrayerName = 'Syuruk'; nextPrayerTime = p.Syuruk; }
      else if (now < p.Dhuha) { activePrayerName = 'Syuruk'; nextPrayerName = 'Dhuha'; nextPrayerTime = p.Dhuha; }
      else if (now < p.Zohor) { activePrayerName = 'Dhuha'; nextPrayerName = 'Zohor'; nextPrayerTime = p.Zohor; }
      else if (now < p.Asar) { activePrayerName = 'Zohor'; nextPrayerName = 'Asar'; nextPrayerTime = p.Asar; }
      else if (now < p.Maghrib) { activePrayerName = 'Asar'; nextPrayerName = 'Maghrib'; nextPrayerTime = p.Maghrib; }
      else { activePrayerName = 'Maghrib'; nextPrayerName = 'Isyak'; nextPrayerTime = p.Isyak; }

      const activeRow = document.getElementById(`row-${activePrayerName}`);
      if (activeRow) activeRow.classList.add('active');

      const labelEl = document.getElementById('cd-label');
      const timeEl = document.getElementById('cd-time');
      
      labelEl.innerText = `Menjelang ${nextPrayerName}`;
      
      let diff = Math.max(0, nextPrayerTime - now);
      let h = Math.floor(diff / 3600);
      let m = Math.floor((diff % 3600) / 60);
      let s = Math.floor(diff % 60);

      timeEl.innerText = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

      if (diff <= 600) {
        timeEl.classList.add('imminent');
      } else {
        timeEl.classList.remove('imminent');
      }
    }

    // --- INITIALIZATION ---
    function changeZone(newZone) {
      localStorage.setItem('selectedZone_v3', newZone);
      fetchPrayerTimes(newZone);
    }

    const savedZone = localStorage.getItem('selectedZone_v3') || 'SGR01';
    document.getElementById('zone-select').value = savedZone;
    fetchPrayerTimes(savedZone);

    setInterval(updateLiveStatus, 1000);
  </script>
</body>
</html>
