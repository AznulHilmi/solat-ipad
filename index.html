<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Landscape Waktu Solat Display - Ulu Langat</title>
  <style>
    :root {
      --gold: #ffd166;
      --teal: #06d6a0;
      --cyan: #48cae4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0d1b2a;
      color: #ffffff;
    }

    /* Dynamic Islamic Background Container */
    #bg-carousel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      background-size: cover;
      background-position: center;
      transition: background 1.5s ease-in-out;
    }

    /* Subtle Overlay for Readability */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      background: radial-gradient(circle, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.5) 100%);
    }

    /* Main Dashboard Layout */
    .dashboard-container {
      position: relative;
      z-index: 3;
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 14px 24px;
      gap: 12px;
    }

    .transparent-card {
      background: transparent;
      border: none;
      padding: 10px;
    }

    /* TOP HEADER: Quran Banner */
    .quran-box {
      text-align: center;
    }

    .quran-ar {
      font-size: 1.45rem;
      color: var(--gold);
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95), 0 0 4px rgba(0,0,0,0.9);
    }

    .quran-en {
      font-size: 0.95rem;
      color: #ffffff;
      font-style: italic;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
    }

    /* MIDDLE CONTENT: 3 Columns */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr;
      gap: 20px;
      height: 100%;
      min-height: 0;
    }

    .col-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* LEFT COL: Clock & Date */
    .time-title {
      font-size: 0.9rem;
      letter-spacing: 2px;
      color: var(--cyan);
      font-weight: 800;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .clock-display {
      font-size: 3.8rem;
      font-weight: 800;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      text-shadow: 0 0 16px rgba(72, 202, 228, 0.9), 0 3px 8px rgba(0,0,0,1);
      margin: 8px 0;
    }

    .gregorian-date {
      font-size: 1.25rem;
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    .hijri-date {
      font-size: 1.1rem;
      color: var(--gold);
      margin-top: 4px;
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    }

    /* CENTER COL: Address + Waktu Solat Table */
    .center-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
    }

    .address-box {
      text-align: center;
      padding: 6px;
    }

    .address-box strong {
      color: var(--cyan);
      font-size: 1.05rem;
      display: block;
      text-shadow: 0 2px 6px rgba(0,0,0,0.95);
    }

    .address-box span {
      font-size: 0.85rem;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0,0,0,0.95);
    }

    .solat-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .solat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 20px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
    }

    .solat-row.active {
      background: linear-gradient(90deg, rgba(6, 214, 160, 0.5) 0%, rgba(72, 202, 228, 0.35) 100%);
      border: 1px solid var(--teal);
      box-shadow: 0 0 14px rgba(6, 214, 160, 0.6);
    }

    .solat-name {
      font-size: 1.45rem;
      font-weight: 800;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
    }

    .solat-time {
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
    }

    /* RIGHT COL: Countdown */
    .next-label {
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    .next-prayer {
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--teal);
      margin: 6px 0;
      text-shadow: 0 0 14px rgba(6, 214, 160, 0.8), 0 3px 8px rgba(0,0,0,1);
    }

    .countdown-box {
      font-size: 3.2rem;
      font-weight: 900;
      color: var(--gold);
      font-family: 'Courier New', Courier, monospace;
      text-shadow: 0 0 12px rgba(255, 209, 102, 0.6), 0 3px 8px rgba(0,0,0,1);
    }

    /* BOTTOM FOOTER: Hadith */
    .footer-bar {
      text-align: center;
    }

    .hadith-ar {
      font-size: 1.2rem;
      color: var(--gold);
      font-weight: 700;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
    }

    .hadith-en {
      font-size: 0.9rem;
      color: #ffffff;
      font-style: italic;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
    }
  </style>
</head>
<body>

  <!-- Dynamic Background Element -->
  <div id="bg-carousel"></div>
  <div class="bg-overlay"></div>

  <div class="dashboard-container">
    
    <!-- TOP SECTION: Quran Verse -->
    <div class="quran-box transparent-card">
      <div class="quran-ar" id="quran-ar">Loading...</div>
      <div class="quran-en" id="quran-en">Loading...</div>
    </div>

    <!-- MAIN DISPLAY (3 COLUMNS) -->
    <div class="main-grid">
      
      <!-- LEFT: Date & Time -->
      <div class="col-card transparent-card">
        <div class="time-title">CURRENT TIME</div>
        <div class="clock-display" id="clock">00:00:00</div>
        <div class="gregorian-date" id="gregorian-date">Loading...</div>
        <div class="hijri-date" id="hijri-date">Loading...</div>
      </div>

      <!-- CENTER: Address Box ON TOP of Solat Box -->
      <div class="center-column">
        <div class="address-box transparent-card">
          <strong>📍 Ulu Langat, Selangor</strong>
          <span>JAKIM Zone: SGR01 (Gombak, Petaling, Hulu Langat)</span>
        </div>

        <div class="solat-container transparent-card">
          <div class="solat-row" id="row-subuh"><span class="solat-name">Subuh</span><span class="solat-time" id="time-subuh">05:59 AM</span></div>
          <div class="solat-row" id="row-syuruk"><span class="solat-name">Syuruk</span><span class="solat-time" id="time-syuruk">07:05 AM</span></div>
          <div class="solat-row" id="row-zohor"><span class="solat-name">Zohor</span><span class="solat-time" id="time-zohor">01:14 PM</span></div>
          <div class="solat-row" id="row-asar"><span class="solat-name">Asar</span><span class="solat-time" id="time-asar">04:18 PM</span></div>
          <div class="solat-row" id="row-maghrib"><span class="solat-name">Maghrib</span><span class="solat-time" id="time-maghrib">07:18 PM</span></div>
          <div class="solat-row" id="row-isyak"><span class="solat-name">Isyak</span><span class="solat-time" id="time-isyak">08:27 PM</span></div>
        </div>
      </div>

      <!-- RIGHT: Countdown -->
      <div class="col-card transparent-card">
        <div class="next-label">COUNTDOWN TO</div>
        <div class="next-prayer" id="next-prayer-name">--</div>
        <div class="countdown-box" id="countdown">00:00:00</div>
      </div>
    </div>

    <!-- BOTTOM SECTION: Hadith -->
    <div class="footer-bar transparent-card">
      <div class="hadith-ar" id="hadith-ar">Loading...</div>
      <div class="hadith-en" id="hadith-en">Loading...</div>
    </div>

  </div>

  <script>
    // Default fallback times for SGR01 (Ulu Langat)
    let prayerTimesToday = {
      subuh: "05:59",
      syuruk: "07:05",
      zohor: "13:14",
      asar: "16:18",
      maghrib: "19:18",
      isyak: "20:27"
    };

    // Fetch official daily prayer times directly from JAKIM API for Zone SGR01
    async function fetchJakimPrayerTimes() {
      try {
        const response = await fetch('https://www.e-solat.gov.my/index.php?r=esolat/jakimperiod&zone=SGR01&period=today');
        const data = await response.json();
        
        if (data && data.prayerTime && data.prayerTime.length > 0) {
          const times = data.prayerTime[0];
          
          // Format 24h string HH:mm from API response (HH:mm:ss)
          prayerTimesToday = {
            subuh: times.fajr.substring(0, 5),
            syuruk: times.syuruk.substring(0, 5),
            zohor: times.dhuhr.substring(0, 5),
            asar: times.asr.substring(0, 5),
            maghrib: times.maghrib.substring(0, 5),
            isyak: times.isha.substring(0, 5)
          };

          // Update UI time labels
          document.getElementById('time-subuh').innerText = format12Hour(prayerTimesToday.subuh);
          document.getElementById('time-syuruk').innerText = format12Hour(prayerTimesToday.syuruk);
          document.getElementById('time-zohor').innerText = format12Hour(prayerTimesToday.zohor);
          document.getElementById('time-asar').innerText = format12Hour(prayerTimesToday.asar);
          document.getElementById('time-maghrib').innerText = format12Hour(prayerTimesToday.maghrib);
          document.getElementById('time-isyak').innerText = format12Hour(prayerTimesToday.isyak);
        }
      } catch (err) {
        console.warn('JAKIM API request failed, utilizing local baseline times for SGR01.', err);
      }
    }

    function format12Hour(time24) {
      const [h, m] = time24.split(':');
      let hours = parseInt(h);
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      return `${String(hours).padStart(2, '0')}:${m} ${ampm}`;
    }

    // SVG Islamic Star Geometry Pattern overlay
    const islamicPatternSVG = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80' viewBox='0 0 80 80'><path fill='%23ffffff' fill-opacity='0.05' d='M0 0h80v80H0z'/><path fill='%23ffffff' fill-opacity='0.08' d='M40 0l11.7 11.7L40 23.4 28.3 11.7zM0 40l11.7-11.7L23.4 40 11.7 51.7zM40 80l-11.7-11.7L40 56.6l11.7 11.7zM80 40l-11.7 11.7L56.6 40l11.7-11.7zM40 28.3l11.7 11.7L40 51.7 28.3 40z'/></svg>";

    // Pure Islamic Themes matched to Prayer Slots
    const prayerBackgroundStyles = {
      subuh: `url("${islamicPatternSVG}"), linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #415a77 100%)`, // Deep Dawn Sky
      syuruk: `url("${islamicPatternSVG}"), linear-gradient(135deg, #2b1e3a 0%, #76527b 50%, #d4a373 100%)`, // Golden Sunrise
      zohor: `url("${islamicPatternSVG}"), linear-gradient(135deg, #005f73 0%, #0a9396 50%, #94d2bd 100%)`, // Bright Daylight Teal
      asar: `url("${islamicPatternSVG}"), linear-gradient(135deg, #2a9d8f 0%, #e9c46a 50%, #f4a261 100%)`,  // Warm Afternoon Gold
      maghrib: `url("${islamicPatternSVG}"), linear-gradient(135deg, #370617 0%, #6a040f 50%, #dc2f02 100%)`,// Twilight Sunset
      isyak: `url("${islamicPatternSVG}"), linear-gradient(135deg, #03071e 0%, #0f172a 50%, #1e1b4b 100%)`  // Deep Night Stars
    };

    let currentPrayerSlot = '';

    function updatePrayerBackground(activeSlot) {
      if (currentPrayerSlot !== activeSlot && prayerBackgroundStyles[activeSlot]) {
        currentPrayerSlot = activeSlot;
        document.getElementById('bg-carousel').style.background = prayerBackgroundStyles[activeSlot];
      }
    }

    // Fetch Daily Quranic Verse
    async function fetchDailyQuran() {
      try {
        const now = new Date();
        const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
        const verseNumber = (dayOfYear * 17) % 6236 + 1; 

        const arRes = await fetch(`https://api.alquran.cloud/v1/ayah/${verseNumber}/ar.alafasy`);
        const arData = await arRes.json();

        const enRes = await fetch(`https://api.alquran.cloud/v1/ayah/${verseNumber}/en.sahih`);
        const enData = await enRes.json();

        if (arData.code === 200 && enData.code === 200) {
          document.getElementById('quran-ar').innerText = arData.data.text;
          document.getElementById('quran-en').innerText = `"${enData.data.text}" — Surah ${enData.data.surah.englishName} (${enData.data.surah.number}:${enData.data.numberInSurah})`;
        }
      } catch (err) {
        document.getElementById('quran-ar').innerText = "الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ اللَّهِ ۗ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ";
        document.getElementById('quran-en').innerText = "\"Those who believe and whose hearts find rest in the remembrance of Allah.\" — Surah Ar-Ra'd 13:28";
      }
    }

    // Fetch Daily Sahih Hadith
    async function fetchDailyHadith() {
      try {
        const res = await fetch(`https://random-hadith-generator.vercel.app/bukhari/`);
        const data = await res.json();

        if (data && data.data) {
          document.getElementById('hadith-ar').innerText = data.data.hadithArabic || "قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ...";
          document.getElementById('hadith-en').innerText = `"${data.data.hadithEnglish}" — ${data.data.refno || 'Sahih Bukhari'}`;
        }
      } catch (err) {
        document.getElementById('hadith-ar').innerText = "مَنْ طَهَّرَ فِي بَيْتِهِ ثُمَّ مَشَى إِلَى بَيْتٍ مِنْ بُيُوتِ اللَّهِ لِيَقْضِيَ فَرِيضَةً كَانَتْ خُطُوَاتُهُ إِحْدَاهُمَا تَحُطُّ خَطِيئَةً وَالأُخْرَى تَرْفَعُ دَرَجَةً";
        document.getElementById('hadith-en').innerText = "\"He who purifies himself in his house and then walks to a house of Allah to perform an obligatory prayer, one step wipes away a sin and the other raises his status.\" — Sahih Muslim 666";
      }
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', { hour12: true });

      const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
      document.getElementById('gregorian-date').innerText = now.toLocaleDateString('en-US', options);

      try {
        document.getElementById('hijri-date').innerText = new Intl.DateTimeFormat('en-TN-u-ca-islamic', {
          day: 'numeric', month: 'long', year: 'numeric'
        }).format(now) + "H";
      } catch (e) {
        document.getElementById('hijri-date').innerText = "";
      }

      updateCountdown(now);
    }

    function updateCountdown(now) {
      const times = [
        { key: "subuh", name: "Subuh", time: prayerTimesToday.subuh, rowId: "row-subuh" },
        { key: "syuruk", name: "Syuruk", time: prayerTimesToday.syuruk, rowId: "row-syuruk" },
        { key: "zohor", name: "Zohor", time: prayerTimesToday.zohor, rowId: "row-zohor" },
        { key: "asar", name: "Asar", time: prayerTimesToday.asar, rowId: "row-asar" },
        { key: "maghrib", name: "Maghrib", time: prayerTimesToday.maghrib, rowId: "row-maghrib" },
        { key: "isyak", name: "Isyak", time: prayerTimesToday.isyak, rowId: "row-isyak" }
      ];

      times.forEach(t => document.getElementById(t.rowId)?.classList.remove('active'));

      let nextPrayer = null;
      let nextPrayerTime = null;
      let activeSlot = 'isyak';

      for (let i = 0; i < times.length; i++) {
        const p = times[i];
        const [hours, minutes] = p.time.split(':');
        const pDate = new Date(now);
        pDate.setHours(parseInt(hours), parseInt(minutes), 0, 0);

        if (pDate > now) {
          nextPrayer = p.name;
          nextPrayerTime = pDate;
          document.getElementById(p.rowId)?.classList.add('active');
          activeSlot = i > 0 ? times[i - 1].key : 'isyak';
          break;
        }
      }

      if (!nextPrayer) {
        nextPrayer = "Subuh";
        const [hours, minutes] = prayerTimesToday.subuh.split(':');
        nextPrayerTime = new Date(now);
        nextPrayerTime.setDate(nextPrayerTime.getDate() + 1);
        nextPrayerTime.setHours(parseInt(hours), parseInt(minutes), 0, 0);
        document.getElementById("row-subuh")?.classList.add('active');
        activeSlot = 'isyak';
      }

      // Update background theme based on active prayer time slot
      updatePrayerBackground(activeSlot);

      document.getElementById('next-prayer-name').innerText = nextPrayer;

      const diffMs = nextPrayerTime - now;
      const hrs = Math.floor(diffMs / (1000 * 60 * 60));
      const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
      const secs = Math.floor((diffMs % (1000 * 60)) / 1000);

      document.getElementById('countdown').innerText = 
        `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    // Initialize
    fetchJakimPrayerTimes();
    fetchDailyQuran();
    fetchDailyHadith();
    updateClock();

    setInterval(updateClock, 1000);
  </script>
</body>
</html>
