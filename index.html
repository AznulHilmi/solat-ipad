<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next Solat - Semenyih (SGR01)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #0b1120;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .panel {
      width: 100%;
      max-width: 540px;
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .label {
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .clock {
      font-size: 3rem;
      font-weight: 800;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #ffffff;
    }

    .date-line {
      font-size: 1.15rem;
      font-weight: 600;
      color: #e2e8f0;
      margin-top: 4px;
    }

    .hijri-line {
      font-size: 1rem;
      font-weight: 600;
      color: #fbbf24;
      margin-top: 2px;
    }

    .divider {
      height: 1px;
      background: #1f2937;
    }

    .next-name {
      font-size: 2.2rem;
      font-weight: 800;
      color: #34d399;
    }

    .next-time {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fbbf24;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      margin-top: 2px;
    }

    .countdown {
      font-size: 2.4rem;
      font-weight: 800;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #38bdf8;
      margin-top: 8px;
    }

    .status {
      font-size: 0.8rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div>
      <div class="label">Current Time & Date</div>
      <div class="clock" id="clock">--:--:--</div>
      <div class="date-line" id="gregorian-date">---</div>
      <div class="hijri-line" id="hijri-date">---</div>
    </div>

    <div class="divider"></div>

    <div>
      <div class="label">Next Solat • Semenyih (SGR01)</div>
      <div class="next-name" id="next-name">--</div>
      <div class="next-time" id="next-time">--:--</div>
      <div class="countdown" id="countdown">00:00:00</div>
    </div>

    <div class="status" id="status-text">Syncing Semenyih (SGR01) schedule...</div>
  </main>

  <script>
    const ZONE = "SGR01";

    // Semenyih (JAKIM Zone SGR01) 24-hour HH:MM fallback times
    let dailyPrayers = {
      Subuh: "05:50",
      Zohor: "13:03",
      Asar: "16:25",
      Maghrib: "19:00",
      Isyak: "20:14"
    };

    let hijriText = "";

    function toHHMM(rawTime) {
      if (!rawTime) return null;
      const match = String(rawTime).match(/(\d{1,2}):(\d{2})/);
      if (!match) return null;
      return match[1].padStart(2, "0") + ":" + match[2].padStart(2, "0");
    }

    function format12Hour(hhmm) {
      const [hStr, mStr] = hhmm.split(":");
      let hour = parseInt(hStr, 10);
      const ampm = hour >= 12 ? "PM" : "AM";
      hour = hour % 12;
      if (hour === 0) hour = 12;
      return String(hour).padStart(2, "0") + ":" + mStr + " " + ampm;
    }

    function updateHijriFallback(now) {
      const formatter = new Intl.DateTimeFormat("en-GB-u-ca-islamic-umalqura", {
        day: "numeric",
        month: "long",
        year: "numeric"
      });
      hijriText = formatter.format(now) + " H";
    }

    async function loadPrayerSchedule() {
      const now = new Date();
      updateHijriFallback(now);

      try {
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const day = now.getDate();

        const res = await fetch(`https://api.waktusolat.app/v2/solat/${ZONE}?year=${year}&month=${month}`);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();

        if (data && Array.isArray(data.prayers)) {
          const todayEntry = data.prayers.find(item => Number(item.day) === day);
          if (todayEntry) {
            const fromEpoch = (sec) => {
              if (!sec) return null;
              const d = new Date(sec * 1000);
              return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
            };

            const subuh = fromEpoch(todayEntry.fajr) || toHHMM(todayEntry.fajr);
            const zohor = fromEpoch(todayEntry.dhuhr) || toHHMM(todayEntry.dhuhr);
            const asar = fromEpoch(todayEntry.asr) || toHHMM(todayEntry.asr);
            const maghrib = fromEpoch(todayEntry.maghrib) || toHHMM(todayEntry.maghrib);
            const isyak = fromEpoch(todayEntry.isha) || toHHMM(todayEntry.isha);

            if (subuh && zohor && asar && maghrib && isyak) {
              dailyPrayers = {
                Subuh: subuh,
                Zohor: zohor,
                Asar: asar,
                Maghrib: maghrib,
                Isyak: isyak
              };
            }

            if (todayEntry.hijri) {
              hijriText = todayEntry.hijri + " H";
            }
          }
        }

        document.getElementById("status-text").textContent = "Live Semenyih (SGR01) schedule synced";
      } catch (err) {
        console.warn("Schedule fetch fallback:", err);
        document.getElementById("status-text").textContent = "Using fallback Semenyih (SGR01) times";
      }
    }

    function tick() {
      const now = new Date();

      document.getElementById("clock").textContent = now.toLocaleTimeString("en-MY", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      });

      document.getElementById("gregorian-date").textContent = now.toLocaleDateString("en-MY", {
        weekday: "short",
        day: "numeric",
        month: "short",
        year: "numeric"
      });

      document.getElementById("hijri-date").textContent = hijriText || "---";

      const order = ["Subuh", "Zohor", "Asar", "Maghrib", "Isyak"];
      let targetName = "Subuh";
      let targetTimeStr = dailyPrayers.Subuh;
      let targetDate = null;

      for (const name of order) {
        const hhmm = dailyPrayers[name];
        if (!hhmm) continue;
        const [hh, mm] = hhmm.split(":").map(Number);
        const candidate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0, 0);
        if (candidate > now) {
          targetName = name;
          targetTimeStr = hhmm;
          targetDate = candidate;
          break;
        }
      }

      if (!targetDate) {
        const [hh, mm] = dailyPrayers.Subuh.split(":").map(Number);
        targetDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, hh, mm, 0, 0);
      }

      const diffSec = Math.max(0, Math.floor((targetDate - now) / 1000));
      const hrs = Math.floor(diffSec / 3600);
      const mins = Math.floor((diffSec % 3600) / 60);
      const secs = diffSec % 60;

      document.getElementById("next-name").textContent = targetName;
      document.getElementById("next-time").textContent = format12Hour(targetTimeStr);
      document.getElementById("countdown").textContent =
        String(hrs).padStart(2, "0") + ":" +
        String(mins).padStart(2, "0") + ":" +
        String(secs).padStart(2, "0");
    }

    loadPrayerSchedule();
    setInterval(loadPrayerSchedule, 3600000);
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
