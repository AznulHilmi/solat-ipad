<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Waktu Solat iPad</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1E1E1E;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    h1 { text-align: center; font-size: 1.8rem; margin-bottom: 8px; color: #4CAF50; }
    p.subtitle { text-align: center; color: #888; margin-bottom: 20px; font-size: 0.9rem; }
    .prayer-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 16px;
      margin-bottom: 8px;
      border-radius: 8px;
      background: #2A2A2A;
      font-size: 1.1rem;
    }
    .prayer-row.dhuha { border-left: 4px solid #FFC107; background: #332B00; }
    .prayer-name { font-weight: 600; }
    .prayer-time { color: #E0E0E0; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Waktu Solat</h1>
    <p class="subtitle" id="zone-info">Loading Zone (SGR01)...</p>
    
    <div id="prayer-list">
      <div class="prayer-row"><span class="prayer-name">Loading times...</span></div>
    </div>
  </div>

  <script>
    function formatTime(timeStr) {
      if(!timeStr) return "--:--";
      let [h, m] = timeStr.split(':').map(Number);
      let ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${h}:${m < 10 ? '0' : ''}${m} ${ampm}`;
    }

    function addMinutes(timeStr, minsToAdd) {
      if(!timeStr) return "--:--";
      let [h, m] = timeStr.split(':').map(Number);
      let date = new Date();
      date.setHours(h, m + minsToAdd, 0);
      let newH = date.getHours();
      let newM = date.getMinutes();
      return `${newH < 10 ? '0' : ''}${newH}:${newM < 10 ? '0' : ''}${newM}`;
    }

    async function fetchPrayerTimes() {
      try {
        const res = await fetch('https://api.waktusolat.online/api/solat/SGR01');
        const data = await res.json();
        const today = data.prayerTime[0]; 

        const dhuha24 = addMinutes(today.syuruk, 28);

        const listHtml = `
          <div class="prayer-row"><span class="prayer-name">Subuh</span><span class="prayer-time">${formatTime(today.fajr)}</span></div>
          <div class="prayer-row"><span class="prayer-name">Syuruk</span><span class="prayer-time">${formatTime(today.syuruk)}</span></div>
          <div class="prayer-row dhuha"><span class="prayer-name">Dhuha</span><span class="prayer-time">${formatTime(dhuha24)}</span></div>
          <div class="prayer-row"><span class="prayer-name">Zohor</span><span class="prayer-time">${formatTime(today.dhuhr)}</span></div>
          <div class="prayer-row"><span class="prayer-name">Asar</span><span class="prayer-time">${formatTime(today.asr)}</span></div>
          <div class="prayer-row"><span class="prayer-name">Maghrib</span><span class="prayer-time">${formatTime(today.maghrib)}</span></div>
          <div class="prayer-row"><span class="prayer-name">Isyak</span><span class="prayer-time">${formatTime(today.isha)}</span></div>
        `;

        document.getElementById('prayer-list').innerHTML = listHtml;
        document.getElementById('zone-info').innerText = "Selangor / KL (SGR01)";
      } catch (err) {
        document.getElementById('prayer-list').innerHTML = `<div class="prayer-row">Failed to load prayer times. Check network.</div>`;
      }
    }

    fetchPrayerTimes();
  </script>
</body>
</html>
