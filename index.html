<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Next Solat - Semenyih (SGR01)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #090d16;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(7, 11, 20, 0.72) 0%,
        rgba(7, 11, 20, 0.84) 100%
      );
      z-index: 0;
      pointer-events: none;
    }

    .panel {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 28px 34px;
      text-align: center;
      display: grid;
      grid-template-columns: 1fr 1px 1.25fr;
      grid-template-rows: 1fr auto;
      align-items: center;
      gap: 20px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .section-left,
    .section-right {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .label {
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .clock {
      font-size: 2.7rem;
      font-weight: 800;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    .date-line {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-top: 8px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    .hijri-line {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fcd34d;
      margin-top: 4px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    .divider {
      width: 1px;
      height: 82%;
      background: rgba(255, 255, 255, 0.14);
      justify-self: center;
    }

    .next-name {
      font-size: 3.8rem;
      font-weight: 900;
      line-height: 1.08;
      color: #34d399;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.8);
    }

    .next-time {
      font-size: 3.4rem;
      font-weight: 900;
      line-height: 1.12;
      color: #fbbf24;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      margin-top: 6px;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.8);
    }

    .countdown-wrap {
      margin-top: 12px;
    }

    .countdown-label {
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 2px;
    }

    .countdown {
      font-size: 1.25rem;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #7dd3fc;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
    }

    .status {
      grid-column: 1 / -1;
      font-size: 0.78rem;
      color: #94a3b8;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    @media (max-width: 699px) {
      body {
        overflow-y: auto;
      }
      .panel {
        max-width: 540px;
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        gap: 18px;
        padding: 24px 20px;
      }
      .divider {
        width: 100%;
        height: 1px;
      }
      .next-name {
        font-size: 3rem;
      }
      .next-time {
        font-size: 2.7rem;
      }
    }
  </style>
</head>
<body>
  <main class="panel">
    <section class="section-left">
      <div class="label">Current Time & Date</div>
      <div class="clock" id="clock">--:--:--</div>
      <div class="date-line" id="gregorian-date">---</div>
      <div class="hijri-line" id="hijri-date">---</div>
    </section>

    <div class="divider"></div>

    <section class="section-right">
      <div class="label">Next Solat • Semenyih (SGR01)</div>
      <div class="next-name" id="next-name">--</div>
      <div class="next-time" id="next-time">--:--</div>

      <div class="countdown-wrap">
        <div class="countdown-label">Countdown</div>
        <div class="countdown" id="countdown">00:00:00</div>
      </div>
    </section>

    <div class="status" id="status-text">Initializing Semenyih (SGR01)...</div>
  </main>

  <script>
    const ZONE = "SGR01";

    const MOSQUE_IMAGES = [
      "https://images.pexels.com/photos/29903471/pexels-photo-29903471.jpeg?auto=compress&cs=tinysrgb&w=1600",
      "https://images.pexels.com/photos/19414000/pexels-photo-19414000.jpeg?auto=compress&cs=tinysrgb&w=1600",
      "https://images.pexels.com/photos/31609068/pexels-photo-31609068.jpeg?auto=compress&cs=tinysrgb&w=1600"
    ];

    const GREGORIAN_MONTHS_BM = [
      "Januari", "Februari", "Mac", "April", "Mei", "Jun",
      "Julai", "Ogos", "September", "Oktober", "November", "Disember"
    ];

    const HIJRI_MONTHS_BM = [
      "Muharram", "Safar", "Rabiulawal", "Rabiulakhir",
      "Jamadilawal", "Jamadilakhir", "Rejab", "Syaaban",
      "Ramadan", "Syawal", "Zulkaedah", "Zulhijjah"
    ];

    let dailyPrayers = {
      Subuh: "05:50",
      Zohor: "13:03",
      Asar: "16:25",
      Maghrib: "19:00",
      Isyak: "20:14"
    };

    let hijriText = "";

    function setStatus(msg) {
      const el = document.getElementById("status-text");
      if (el) el.textContent = msg;
    }

    function applyRandomMosqueBackground() {
      try {
        if (!MOSQUE_IMAGES.length) return;
        const idx = Math.floor(Math.random() * MOSQUE_IMAGES.length);
        document.body.style.backgroundImage = 'url("' + MOSQUE_IMAGES[idx] + '")';
      } catch (e) {}
    }

    function formatDDMonthYYYY(day, monthName, year) {
      const dd = String(day).padStart(2, "0");
      return dd + " " + monthName + " " + year;
    }

    function formatGregorianDDMonthYYYY(now) {
      const dd = String(now.getDate()).padStart(2, "0");
      const monthName = GREGORIAN_MONTHS_BM[now.getMonth()] || "";
      const yyyy = now.getFullYear();
      return dd + " " + monthName + " " + yyyy;
    }

    function formatHijriFromParts(dayNum, monthNum, yearStr) {
      const monthName = (monthNum >= 1 && monthNum <= 12)
        ? HIJRI_MONTHS_BM[monthNum - 1]
        : String(monthNum);
      return formatDDMonthYYYY(dayNum, monthName, yearStr) + " H";
    }

    function updateHijriFallback(now) {
      try {
        const parts = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", {
          day: "numeric",
          month: "numeric",
          year: "numeric"
        }).formatToParts(now);

        const dayPart = parts.find(function(p) { return p.type === "day"; });
        const monthPart = parts.find(function(p) { return p.type === "month"; });
        const yearPart = parts.find(function(p) { return p.type === "year"; });

        const dayVal = Number(dayPart ? dayPart.value : 1);
        const monthVal = Number(monthPart ? monthPart.value : 1);
        const cleanYear = String(yearPart ? yearPart.value : "").replace(/\s*AH/i, "").trim();

        if (cleanYear) {
          hijriText = formatHijriFromParts(dayVal, monthVal, cleanYear);
        }
      } catch (e) {
        if (!hijriText) hijriText = "Kalendar Hijri";
      }
    }

    function parseApiHijriToDDMonthYYYY(rawHijri) {
      if (!rawHijri) return null;
      const str = String(rawHijri).trim();
      const isoMatch = str.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
      if (isoMatch) {
        return formatHijriFromParts(Number(isoMatch[3]), Number(isoMatch[2]), isoMatch[1]);
      }
      const dmyMatch = str.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
      if (dmyMatch) {
        return formatHijriFromParts(Number(dmyMatch[1]), Number(dmyMatch[2]), dmyMatch[3]);
      }
      return null;
    }

    function toHHMM(rawTime) {
      if (!rawTime) return null;
      const match = String(rawTime).match(/(\d{1,2}):(\d{2})/);
      if (!match) return null;
      return match[1].padStart(2, "0") + ":" + match[2].padStart(2, "0");
    }

    function format12Hour(hhmm) {
      const parts = hhmm.split(":");
      let hour = parseInt(parts[0], 10);
      const minute = parts[1];
      const ampm = hour >= 12 ? "PM" : "AM";
      hour = hour % 12;
      if (hour === 0) hour = 12;
      return String(hour).padStart(2, "0") + ":" + minute + " " + ampm;
    }

    function fetchWithTimeout(url, ms) {
      return new Promise(function(resolve, reject) {
        const timer = setTimeout(function() {
          reject(new Error("Request timeout"));
        }, ms);

        fetch(url)
          .then(function(res) {
            clearTimeout(timer);
            resolve(res);
          })
          .catch(function(err) {
            clearTimeout(timer);
            reject(err);
          });
      });
    }

    async function loadPrayerSchedule() {
      const now = new Date();
      updateHijriFallback(now);
      setStatus("Syncing Semenyih (SGR01) schedule...");

      try {
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const day = now.getDate();

        const url = "https://api.waktusolat.app/v2/solat/" + ZONE + "?year=" + year + "&month=" + month;
        const res = await fetchWithTimeout(url, 7000);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();

        if (data && Array.isArray(data.prayers)) {
          const todayEntry = data.prayers.find(function(item) {
            return Number(item.day) === day;
          });

          if (todayEntry) {
            const fromEpoch = function(sec) {
              if (!sec) return null;
              const d = new Date(sec * 1000);
              return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
            };

            const subuh = fromEpoch(todayEntry.fajr) || toHHMM(todayEntry.fajr);
            const zohor = fromEpoch(todayEntry.dhuhr) || toHHMM(todayEntry.dhuhr);
            const asar = fromEpoch(todayEntry.asr) || toHHMM(todayEntry.asr);
            const maghrib = fromEpoch(todayEntry.maghrib) || toHHMM(todayEntry.maghrib);
            const isyak = fromEpoch(todayEntry.isha) || toHHMM(todayEntry.isha);

            if (subuh && zohor && asar && maghrib && isyak) {
              dailyPrayers = {
                Subuh: subuh,
                Zohor: zohor,
                Asar: asar,
                Maghrib: maghrib,
                Isyak: isyak
              };
            }

            const formattedApiHijri = parseApiHijriToDDMonthYYYY(todayEntry.hijri);
            if (formattedApiHijri) {
              hijriText = formattedApiHijri;
            }
          }
        }

        setStatus("Live Semenyih (SGR01) schedule synced");
      } catch (err) {
        console.warn("Using fallback Semenyih (SGR01) times:", err);
        setStatus("Using Semenyih (SGR01) fallback schedule");
      }
    }

    function tick() {
      try {
        const now = new Date();

        const clockEl = document.getElementById("clock");
        if (clockEl) {
          clockEl.textContent = now.toLocaleTimeString("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: true
          });
        }

        const gregEl = document.getElementById("gregorian-date");
        if (gregEl) {
          gregEl.textContent = formatGregorianDDMonthYYYY(now);
        }

        const hijriEl = document.getElementById("hijri-date");
        if (hijriEl) {
          hijriEl.textContent = hijriText || "Kalendar Hijri";
        }

        const order = ["Subuh", "Zohor", "Asar", "Maghrib", "Isyak"];
        let targetName = "Subuh";
        let targetTimeStr = dailyPrayers.Subuh;
        let targetDate = null;

        for (let i = 0; i < order.length; i++) {
          const name = order[i];
          const hhmm = dailyPrayers[name];
          if (!hhmm) continue;
          const parts = hhmm.split(":");
          const hh = parseInt(parts[0], 10);
          const mm = parseInt(parts[1], 10);
          const candidate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0, 0);
          if (candidate > now) {
            targetName = name;
            targetTimeStr = hhmm;
            targetDate = candidate;
            break;
          }
        }

        if (!targetDate) {
          const subParts = dailyPrayers.Subuh.split(":");
          targetDate = new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate() + 1,
            parseInt(subParts[0], 10),
            parseInt(subParts[1], 10),
            0,
            0
          );
        }

        const diffSec = Math.max(0, Math.floor((targetDate - now) / 1000));
        const hrs = Math.floor(diffSec / 3600);
        const mins = Math.floor((diffSec % 3600) / 60);
        const secs = diffSec % 60;

        const nameEl = document.getElementById("next-name");
        const timeEl = document.getElementById("next-time");
        const countEl = document.getElementById("countdown");

        if (nameEl) nameEl.textContent = target
