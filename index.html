<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Next Solat - Semenyih (SGR01)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #090d16;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(7, 11, 20, 0.72) 0%,
        rgba(7, 11, 20, 0.85) 100%
      );
      z-index: 0;
      pointer-events: none;
    }

    .panel {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      background: rgba(15, 23, 42, 0.80);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 28px 34px;
      text-align: center;
      display: grid;
      grid-template-columns: 1fr 1px 1.25fr;
      grid-template-rows: 1fr auto;
      align-items: center;
      gap: 20px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .section-left,
    .section-right {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .label {
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .clock {
      font-size: 2.7rem;
      font-weight: 800;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    .date-line {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-top: 8px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    .hijri-line {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fcd34d;
      margin-top: 4px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    .divider {
      width: 1px;
      height: 82%;
      background: rgba(255, 255, 255, 0.16);
      justify-self: center;
    }

    .next-name {
      font-size: 3.8rem;
      font-weight: 900;
      line-height: 1.08;
      color: #34d399;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.8);
    }

    .next-time {
      font-size: 3.4rem;
      font-weight: 900;
      line-height: 1.12;
      color: #fbbf24;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      margin-top: 6px;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.8);
    }

    .countdown-wrap {
      margin-top: 12px;
    }

    .countdown-label {
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 2px;
    }

    .countdown {
      font-size: 1.25rem;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: #7dd3fc;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
    }

    .status {
      grid-column: 1 / -1;
      font-size: 0.78rem;
      color: #94a3b8;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    @media (max-width: 699px) {
      body {
        overflow-y: auto;
      }

      .panel {
        max-width: 540px;
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        gap: 18px;
        padding: 24px 20px;
      }

      .divider {
        width: 100%;
        height: 1px;
      }

      .next-name {
        font-size: 3rem;
      }

      .next-time {
        font-size: 2.7rem;
      }
    }
  </style>
</head>
<body>
  <main class="panel">
    <section class="section-left">
      <div class="label">Current Time &amp; Date</div>
      <div class="clock" id="clock">--:--:--</div>
      <div class="date-line" id="gregorian-date">---</div>
      <div class="hijri-line" id="hijri-date">---</div>
    </section>

    <div class="divider"></div>

    <section class="section-right">
      <div class="label">Next Solat &bull; Semenyih (SGR01)</div>
      <div class="next-name" id="next-name">--</div>
      <div class="next-time" id="next-time">--:--</div>

      <div class="countdown-wrap">
        <div class="countdown-label">Countdown</div>
        <div class="countdown" id="countdown">00:00:00</div>
      </div>
    </section>

    <div class="status" id="status-text">Ready &bull; Semenyih (SGR01)</div>
  </main>

  <script>
    window.addEventListener("DOMContentLoaded", function () {
      var ZONE = "SGR01";

      var MOSQUE_IMAGES = [
        "https://images.pexels.com/photos/29903471/pexels-photo-29903471.jpeg?auto=compress&cs=tinysrgb&w=1600",
        "https://images.pexels.com/photos/19414000/pexels-photo-19414000.jpeg?auto=compress&cs=tinysrgb&w=1600",
        "https://images.pexels.com/photos/31609068/pexels-photo-31609068.jpeg?auto=compress&cs=tinysrgb&w=1600"
      ];

      var GREGORIAN_MONTHS_BM = [
        "Januari", "Februari", "Mac", "April", "Mei", "Jun",
        "Julai", "Ogos", "September", "Oktober", "November", "Disember"
      ];

      var HIJRI_MONTHS_BM = [
        "Muharram", "Safar", "Rabiulawal", "Rabiulakhir",
        "Jamadilawal", "Jamadilakhir", "Rejab", "Syaaban",
        "Ramadan", "Syawal", "Zulkaedah", "Zulhijjah"
      ];

      var dailyPrayers = {
        Subuh: "05:50",
        Zohor: "13:03",
        Asar: "16:25",
        Maghrib: "19:00",
        Isyak: "20:14"
      };

      var hijriText = "";

      function pad2(n) {
        n = parseInt(n, 10) || 0;
        return (n < 10 ? "0" : "") + n;
      }

      function setStatus(msg) {
        try {
          var el = document.getElementById("status-text");
          if (el) el.textContent = msg;
        } catch (e) {}
      }

      function setRandomBackground() {
        try {
          if (!MOSQUE_IMAGES || MOSQUE_IMAGES.length === 0) return;
          var idx = Math.floor(Math.random() * MOSQUE_IMAGES.length);
          document.body.style.backgroundImage = 'url("' + MOSQUE_IMAGES[idx] + '")';
        } catch (e) {}
      }

      function formatGregorianDDMonthYYYY(d) {
        var dd = pad2(d.getDate());
        var monthName = GREGORIAN_MONTHS_BM[d.getMonth()] || "";
        var yyyy = d.getFullYear();
        return dd + " " + monthName + " " + yyyy;
      }

      function formatHijriDDMonthYYYY(dayNum, monthNum, yearVal) {
        var mIdx = (parseInt(monthNum, 10) || 1) - 1;
        var monthName = (mIdx >= 0 && mIdx < 12) ? HIJRI_MONTHS_BM[mIdx] : String(monthNum);
        return pad2(dayNum) + " " + monthName + " " + String(yearVal).trim() + " H";
      }

      function computeHijriFallback(d) {
        try {
          if (typeof Intl !== "undefined" && Intl.DateTimeFormat) {
            var fmt = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", {
              day: "numeric",
              month: "numeric",
              year: "numeric"
            });
            if (typeof fmt.formatToParts === "function") {
              var parts = fmt.formatToParts(d);
              var dayVal = 1;
              var monthVal = 1;
              var yearVal = "";
              for (var i = 0; i < parts.length; i++) {
                if (parts[i].type === "day") dayVal = parseInt(parts[i].value, 10) || 1;
                if (parts[i].type === "month") monthVal = parseInt(parts[i].value, 10) || 1;
                if (parts[i].type === "year") yearVal = parts[i].value.replace(/\s*AH/i, "").trim();
              }
              if (yearVal) {
                hijriText = formatHijriDDMonthYYYY(dayVal, monthVal, yearVal);
                return;
              }
            }
          }
        } catch (e) {}

        var jd = Math.floor(d.getTime() / 86400000) + 2440587;
        var l = jd - 1948440 + 10632;
        var n = Math.floor((l - 1) / 10631);
        l = l - n * 10631 + 354;
        var j = (Math.floor((10985 - l) / 5316)) * (Math.floor((50 * l) / 17719)) +
                (Math.floor(l / 5670)) * (Math.floor((43 * l) / 15238));
        l = l - (Math.floor((30 - j) / 15)) * (Math.floor((17719 * j) / 50)) -
            (Math.floor(j / 16)) * (Math.floor((15238 * j) / 43)) + 29;
        var hMonth = Math.floor((24 * l) / 709);
        var hDay = l - Math.floor((709 * hMonth) / 24);
        var hYear = Math.floor(30 * n + j - 30);
        hijriText = formatHijriDDMonthYYYY(hDay, hMonth, hYear);
      }

      function epochToHHMM(sec) {
        if (!sec) return null;
        var dt = new Date(parseInt(sec, 10) * 1000);
        if (isNaN(dt.getTime())) return null;
        return pad2(dt.getHours()) + ":" + pad2(dt.getMinutes());
      }

      function format12Hour(hhmm) {
        var parts = String(hhmm || "00:00").split(":");
        var h24 = parseInt(parts[0], 10) || 0;
        var mm = pad2(parts[1] || 0);
        var ampm = h24 >= 12 ? "PM" : "AM";
        var h12 = h24 % 12;
        if (h12 === 0) h12 = 12;
        return pad2(h12) + ":" + mm + " " + ampm;
      }

      function parseHijriString(raw) {
        if (!raw) return null;
        var s = String(raw).trim();
        var iso = s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
        if (iso) {
          return formatHijriDDMonthYYYY(iso[3], iso[2], iso[1]);
        }
        var dmy = s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/);
        if (dmy) {
          return formatHijriDDMonthYYYY(dmy[1], dmy[2], dmy[3]);
        }
        return null;
      }

      function syncSchedule() {
        var now = new Date();
        computeHijriFallback(now);

        try {
          if (typeof XMLHttpRequest === "undefined") {
            setStatus("Using Semenyih (SGR01) schedule");
            return;
          }
          var year = now.getFullYear();
          var month = now.getMonth() + 1;
          var day = now.getDate();
          var url = "https://api.waktusolat.app/v2/solat/" + ZONE + "?year=" + year + "&month=" + month;

          var xhr = new XMLHttpRequest();
          xhr.open("GET", url, true);
          xhr.timeout = 6000;

          xhr.onload = function () {
            if (xhr.status >= 200 && xhr.status < 300) {
              try {
                var data = JSON.parse(xhr.responseText);
                if (data && data.prayers && data.prayers.length) {
                  var todayRow = null;
                  for (var i = 0; i < data.prayers.length; i++) {
                    if (parseInt(data.prayers[i].day, 10) === day) {
                      todayRow = data.prayers[i];
                      break;
                    }
                  }
                  if (todayRow) {
                    var subuh = epochToHHMM(todayRow.fajr);
                    var zohor = epochToHHMM(todayRow.dhuhr);
                    var asar = epochToHHMM(todayRow.asr);
                    var maghrib = epochToHHMM(todayRow.maghrib);
                    var isyak = epochToHHMM(todayRow.isha);

                    if (subuh && zohor && asar && maghrib && isyak) {
                      dailyPrayers.Subuh = subuh;
                      dailyPrayers.Zohor = zohor;
                      dailyPrayers.Asar = asar;
                      dailyPrayers.Maghrib = maghrib;
                      dailyPrayers.Isyak = isyak;
                    }

                    var parsedHijri = parseHijriString(todayRow.hijri);
                    if (parsedHijri) {
                      hijriText = parsedHijri;
                    }
                    setStatus("Live Semenyih (SGR01) schedule synced");
                    return;
                  }
                }
              } catch (parseErr) {}
            }
            setStatus("Using Semenyih (SGR01) schedule");
          };

          xhr.onerror = function () {
            setStatus("Using Semenyih (SGR01) schedule");
          };

          xhr.ontimeout = function () {
            setStatus("Using Semenyih (SGR01) schedule");
          };

          xhr.send();
        } catch (err) {
          setStatus("Using Semenyih (SGR01) schedule");
        }
      }

      function tick() {
        var now = new Date();

        try {
          var h24 = now.getHours();
          var mins = now.getMinutes();
          var secs = now.getSeconds();
          var ampm = h24 >= 12 ? "PM" : "AM";
          var h12 = h24 % 12;
          if (h12 === 0) h12 = 12;

          var clockEl = document.getElementById("clock");
          if (clockEl) {
            clockEl.textContent = pad2(h12) + ":" + pad2(mins) + ":" + pad2(secs) + " " + ampm;
          }
        } catch (e1) {}

        try {
          var gregEl = document.getElementById("gregorian-date");
          if (gregEl) {
            gregEl.textContent = formatGregorianDDMonthYYYY(now);
          }
        } catch (e2) {}

        try {
          if (!hijriText) {
            computeHijriFallback(now);
          }
          var hijriEl = document.getElementById("hijri-date");
          if (hijriEl && hijriText) {
            hijriEl.textContent = hijriText;
          }
        } catch (e3) {}

        try {
          var order = ["Subuh", "Zohor", "Asar", "Maghrib", "Isyak"];
          var targetName = "Subuh";
          var targetTimeStr = dailyPrayers.Subuh;
          var targetDate = null;

          for (var i = 0; i < order.length; i++) {
            var pName = order[i];
            var hhmm = dailyPrayers[pName];
            if (!hhmm) continue;
            var parts = hhmm.split(":");
            var pHour = parseInt(parts[0], 10);
            var pMin = parseInt(parts[1], 10);
            var candidate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), pHour, pMin, 0, 0);
            if (candidate.getTime() > now.getTime()) {
              targetName = pName;
              targetTimeStr = hhmm;
              targetDate = candidate;
              break;
            }
          }

          if (!targetDate) {
            var subParts = dailyPrayers.Subuh.split(":");
            targetDate = new Date(
              now.getFullYear(),
              now.getMonth(),
              now.getDate() + 1,
              parseInt(subParts[0], 10),
              parseInt(subParts[1], 10),
              0,
              0
            );
          }

          var diffSec = Math.max(0, Math.floor((targetDate.getTime() - now.getTime()) / 1000));
          var remHrs = Math.floor(diffSec / 3600);
          var remMins = Math.floor((diffSec % 3600) / 60);
          var remSecs = diffSec % 60;

          var nameEl = document.getElementById("next-name");
          var timeEl = document.getElementById("next-time");
          var countEl = document.getElementById("countdown");

          if (nameEl) nameEl.textContent = targetName;
          if (timeEl) timeEl.textContent = format12Hour(targetTimeStr);
          if (countEl) {
            countEl.textContent = pad2(remHrs) + ":" + pad2(remMins) + ":" + pad2(remSecs);
          }
        } catch (e4) {}
      }

      setRandomBackground();
      tick();
      setInterval(tick, 1000);
      syncSchedule();
      setInterval(syncSchedule, 3600000);
    });
  </script>
</body>
</html>
