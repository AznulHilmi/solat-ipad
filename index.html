<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Waktu Solat Display</title>
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: #1c2541;
      --accent-color: #48cae4;
      --gold-color: #ffd166;
      --text-main: #ffffff;
      --text-sub: #00b4d8;
      --highlight: #06d6a0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    /* Top Quran Section */
    .top-quran {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .quran-arabic {
      font-size: 1.8rem;
      color: var(--gold-color);
      margin-bottom: 10px;
      line-height: 1.6;
    }

    .quran-english {
      font-size: 1.1rem;
      color: #e0e0e0;
      font-style: italic;
    }

    /* Main Grid Section */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1fr;
      gap: 20px;
      flex-grow: 1;
      margin-bottom: 20px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    /* Left Card: Date & Time */
    .time-display {
      font-size: 2.8rem;
      font-weight: bold;
      color: var(--accent-color);
      font-family: monospace;
      margin: 15px 0;
    }

    .date-gregorian {
      font-size: 1.2rem;
      color: #fff;
    }

    .date-hijri {
      font-size: 1.1rem;
      color: var(--gold-color);
      margin-top: 5px;
    }

    /* Center Card: Solat Times */
    .location-header {
      font-size: 0.95rem;
      color: var(--accent-color);
      margin-bottom: 15px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
      width: 100%;
    }

    .solat-table {
      width: 100%;
      border-collapse: collapse;
    }

    .solat-table tr {
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .solat-table tr.active {
      background-color: rgba(6, 214, 160, 0.15);
      border-radius: 8px;
    }

    .solat-table td {
      padding: 10px 15px;
      font-size: 1.2rem;
    }

    .solat-name {
      text-align: left;
      font-weight: 600;
    }

    .solat-time {
      text-align: right;
      color: var(--gold-color);
      font-weight: bold;
    }

    /* Right Card: Countdown */
    .countdown-title {
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ccc;
    }

    .next-prayer-name {
      font-size: 2rem;
      color: var(--highlight);
      margin: 10px 0;
      font-weight: bold;
    }

    .countdown-timer {
      font-size: 3rem;
      font-weight: bold;
      color: var(--gold-color);
      font-family: monospace;
      background: rgba(0,0,0,0.3);
      padding: 10px 20px;
      border-radius: 10px;
      border: 1px solid rgba(255, 209, 102, 0.3);
    }

    /* Bottom Hadith Section */
    .bottom-hadith {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .hadith-arabic {
      font-size: 1.4rem;
      color: var(--gold-color);
      margin-bottom: 8px;
      line-height: 1.5;
    }

    .hadith-english {
      font-size: 1rem;
      color: #e0e0e0;
      font-style: italic;
    }

    @media (max-width: 900px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- TOP: Daily Quranic Verse -->
  <div class="top-quran">
    <div class="quran-arabic" id="quran-ar">Loading...</div>
    <div class="quran-english" id="quran-en">Loading...</div>
  </div>

  <!-- CENTER: 3-Column Display -->
  <div class="main-grid">
    <!-- LEFT: Date & Time -->
    <div class="card">
      <div style="font-size: 0.9rem; letter-spacing: 1px; color: var(--text-sub);">CURRENT TIME</div>
      <div class="time-display" id="clock">00:00:00</div>
      <div class="date-gregorian" id="gregorian-date">Loading date...</div>
      <div class="date-hijri" id="hijri-date">Loading Hijri...</div>
    </div>

    <!-- CENTER: Waktu Solat -->
    <div class="card">
      <div class="location-header">
        <strong>📍 No 8, Jalan Serene 3/4, Serene Heights</strong><br>
        43500 Semenyih, Selangor (SGR01)
      </div>
      <table class="solat-table">
        <tr id="row-subuh"><td class="solat-name">Subuh</td><td class="solat-time" id="time-subuh">--:--</td></tr>
        <tr id="row-syuruk"><td class="solat-name">Syuruk</td><td class="solat-time" id="time-syuruk">--:--</td></tr>
        <tr id="row-zohor"><td class="solat-name">Zohor</td><td class="solat-time" id="time-zohor">--:--</td></tr>
        <tr id="row-asar"><td class="solat-name">Asar</td><td class="solat-time" id="time-asar">--:--</td></tr>
        <tr id="row-maghrib"><td class="solat-name">Maghrib</td><td class="solat-time" id="time-maghrib">--:--</td></tr>
        <tr id="row-isyak"><td class="solat-name">Isyak</td><td class="solat-time" id="time-isyak">--:--</td></tr>
      </table>
    </div>

    <!-- RIGHT: Countdown -->
    <div class="card">
      <div class="countdown-title">Next Prayer In</div>
      <div class="next-prayer-name" id="next-prayer-name">--</div>
      <div class="countdown-timer" id="countdown">00:00:00</div>
    </div>
  </div>

  <!-- BOTTOM: Daily Sahih Hadith -->
  <div class="bottom-hadith">
    <div class="hadith-arabic" id="hadith-ar">Loading...</div>
    <div class="hadith-english" id="hadith-en">Loading...</div>
  </div>

  <script>
    // Daily Rotating Quranic Verses
    const quranVerses = [
      {
        ar: "الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ اللَّهِ ۗ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ",
        en: "\"Those who believe and whose hearts find rest in the remembrance of Allah. Unquestionably, by the remembrance of Allah do hearts find rest.\" — (Surah Ar-Ra'd 13:28)"
      },
      {
        ar: "وَأَقِيمُوا الصَّلَاةَ وَآتُوا الزَّكَاةَ وَارْكَعُوا مَعَ الرَّاكِعِينَ",
        en: "\"And establish prayer and give zakah and bow with those who bow [in worship].\" — (Surah Al-Baqarah 2:43)"
      },
      {
        ar: "إِنَّ الصَّلَاةَ كَانَتْ عَلَى الْمُؤْمِنِينَ كِتَابًامَّوْقُوتًا",
        en: "\"Indeed, prayer has been decreed upon the believers a decree of specified times.\" — (Surah An-Nisa 4:103)"
      },
      {
        ar: "وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ ۚ وَإِنَّهَا لَكَبِيرَةٌ إِلَّا عَلَى الْخَاشِعِينَ",
        en: "\"And seek help through patience and prayer, and indeed, it is difficult except for the humbly submissive [to Allah].\" — (Surah Al-Baqarah 2:45)"
      },
      {
        ar: "فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ",
        en: "\"So remember Me; I will remember you. And be grateful to Me and do not deny Me.\" — (Surah Al-Baqarah 2:152)"
      }
    ];

    // Daily Rotating Sahih Hadiths
    const sahihHadiths = [
      {
        ar: "مَنْ طَهَّرَ فِي بَيْتِهِ ثُمَّ مَشَى إِلَى بَيْتٍ مِنْ بُيُوتِ اللَّهِ لِيَقْضِيَ فَرِيضَةً كَانَتْ خُطُوَاتُهُ إِحْدَاهُمَا تَحُطُّ خَطِيئَةً وَالأُخْرَى تَرْفَعُ دَرَجَةً",
        en: "\"He who purifies himself in his house and then walks to one of the houses of Allah to perform an obligatory prayer, one of his steps wipes away a sin and the other raises his status.\" — Sahih Muslim 666"
      },
      {
        ar: "بُنِيَ الإِسْلاَمُ عَلَى خَمْسٍ: شَهَادَةِ أَنْ لاَ إِلَهَ إِلاَّ اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ، وَإِقَامِ الصَّلاَةِ، وَإِيتَاءِ الزَّكَاةِ...",
        en: "\"Islam is built upon five pillars: Testifying that there is no god but Allah and Muhammad is His messenger, establishing prayer, paying Zakah...\" — Sahih Bukhari 8"
      },
      {
        ar: "أَحَبُّ الأَعْمَالِ إِلَى اللَّهِ الصَّلاَةُ عَلَى وَقْتِهَا",
        en: "\"The most beloved of deeds to Allah is the prayer offered at its proper time.\" — Sahih Bukhari 527"
      },
      {
        ar: "مَنْ صَلَّى الْبَرْدَيْنِ دَخَلَ الْجَنَّةَ",
        en: "\"Whoever prays the two cool prayers (Asr and Fajr) will enter Paradise.\" — Sahih Bukhari 574"
      }
    ];

    let prayerTimesToday = {
      subuh: "05:52",
      syuruk: "07:03",
      zohor: "13:15",
      asar: "16:21",
      maghrib: "19:20",
      isyak: "20:29"
    };

    function updateDailyContent() {
      const now = new Date();
      const startOfYear = new Date(now.getFullYear(), 0, 0);
      const diff = now - startOfYear;
      const dayOfYear = Math.floor(diff / (1000 * 60 * 60 * 24));

      const quranIndex = dayOfYear % quranVerses.length;
      const hadithIndex = dayOfYear % sahihHadiths.length;

      document.getElementById('quran-ar').innerText = quranVerses[quranIndex].ar;
      document.getElementById('quran-en').innerText = quranVerses[quranIndex].en;

      document.getElementById('hadith-ar').innerText = sahihHadiths[hadithIndex].ar;
      document.getElementById('hadith-en').innerText = sahihHadiths[hadithIndex].en;
    }

    function renderPrayerTimes() {
      document.getElementById('time-subuh').innerText = prayerTimesToday.subuh + " AM";
      document.getElementById('time-syuruk').innerText = prayerTimesToday.syuruk + " AM";
      document.getElementById('time-zohor').innerText = "01:15 PM";
      document.getElementById('time-asar').innerText = "04:21 PM";
      document.getElementById('time-maghrib').innerText = "07:20 PM";
      document.getElementById('time-isyak').innerText = "08:29 PM";
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', { hour12: true });

      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById('gregorian-date').innerText = now.toLocaleDateString('en-US', options);
      
      try {
        document.getElementById('hijri-date').innerText = new Intl.DateTimeFormat('en-TN-u-ca-islamic', {
          day: 'numeric', month: 'long', year: 'numeric'
        }).format(now) + "H";
      } catch (e) {
        document.getElementById('hijri-date').innerText = "";
      }

      updateCountdown(now);
    }

    function updateCountdown(now) {
      const times = [
        { name: "Subuh", time: prayerTimesToday.subuh, rowId: "row-subuh" },
        { name: "Syuruk", time: prayerTimesToday.syuruk, rowId: "row-syuruk" },
        { name: "Zohor", time: prayerTimesToday.zohor, rowId: "row-zohor" },
        { name: "Asar", time: prayerTimesToday.asar, rowId: "row-asar" },
        { name: "Maghrib", time: prayerTimesToday.maghrib, rowId: "row-maghrib" },
        { name: "Isyak", time: prayerTimesToday.isyak, rowId: "row-isyak" }
      ];

      // Reset row highlights
      times.forEach(t => {
        const el = document.getElementById(t.rowId);
        if (el) el.classList.remove('active');
      });

      let nextPrayer = null;
      let nextPrayerTime = null;

      for (let p of times) {
        const [hours, minutes] = p.time.split(':');
        const pDate = new Date(now);
        pDate.setHours(parseInt(hours), parseInt(minutes), 0, 0);

        if (pDate > now) {
          nextPrayer = p.name;
          nextPrayerTime = pDate;
          const targetRow = document.getElementById(p.rowId);
          if (targetRow) targetRow.classList.add('active');
          break;
        }
      }

      if (!nextPrayer) {
        nextPrayer = "Subuh";
        const [hours, minutes] = prayerTimesToday.subuh.split(':');
        nextPrayerTime = new Date(now);
        nextPrayerTime.setDate(nextPrayerTime.getDate() + 1);
        nextPrayerTime.setHours(parseInt(hours), parseInt(minutes), 0, 0);
        const subuhRow = document.getElementById("row-subuh");
        if (subuhRow) subuhRow.classList.add('active');
      }

      document.getElementById('next-prayer-name').innerText = nextPrayer;

      const diffMs = nextPrayerTime - now;
      const hrs = Math.floor(diffMs / (1000 * 60 * 60));
      const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
      const secs = Math.floor((diffMs % (1000 * 60)) / 1000);

      document.getElementById('countdown').innerText = 
        `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    // Initialize display
    updateDailyContent();
    renderPrayerTimes();
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
