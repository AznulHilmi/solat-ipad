<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Landscape Waktu Solat Display</title>
  <style>
    :root {
      --gold: #ffd166;
      --teal: #06d6a0;
      --cyan: #48cae4;
      --glass-bg: rgba(15, 23, 42, 0.35); /* Translucent so background shows clearly */
      --glass-border: rgba(255, 255, 255, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #050b14;
      color: #ffffff;
    }

    /* Dynamic Background Carousel */
    #bg-carousel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      background-size: cover;
      background-position: center;
      transition: background-image 1.5s ease-in-out;
    }

    /* Subtle Overlay for Contrast */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.5) 100%);
    }

    /* Main Dashboard Layout */
    .dashboard-container {
      position: relative;
      z-index: 3;
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 14px 20px;
      gap: 12px;
    }

    /* Glassmorphism Panel */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
    }

    /* TOP HEADER: Quran Banner */
    .quran-box {
      padding: 8px 16px;
      text-align: center;
    }

    .quran-ar {
      font-size: 1.35rem;
      color: var(--gold);
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .quran-en {
      font-size: 0.9rem;
      color: #f1f5f9;
      font-style: italic;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* MIDDLE CONTENT: 3 Columns */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1.3fr 1fr;
      gap: 14px;
      height: 100%;
      min-height: 0;
    }

    .col-card {
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* LEFT COL: Clock & Date */
    .time-title {
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: var(--cyan);
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .clock-display {
      font-size: 3.6rem;
      font-weight: 800;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      text-shadow: 0 0 16px rgba(72, 202, 228, 0.8), 0 2px 4px rgba(0,0,0,0.9);
      margin: 8px 0;
    }

    .gregorian-date {
      font-size: 1.2rem;
      font-weight: 700;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .hijri-date {
      font-size: 1.05rem;
      color: var(--gold);
      margin-top: 4px;
      font-weight: 600;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* CENTER COL: Address + Waktu Solat Table */
    .center-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
      height: 100%;
    }

    /* Dedicated Address Box directly on top of Solat Box */
    .address-box {
      padding: 8px 14px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--cyan);
      border-radius: 12px;
      text-align: center;
    }

    .address-box strong {
      color: var(--cyan);
      font-size: 1rem;
      display: block;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .address-box span {
      font-size: 0.8rem;
      color: #e2e8f0;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    /* Solat Box - Tight layout & Big Fonts */
    .solat-container {
      flex-grow: 1;
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .solat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 18px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .solat-row.active {
      background: linear-gradient(90deg, rgba(6, 214, 160, 0.45) 0%, rgba(72, 202, 228, 0.3) 100%);
      border: 1px solid var(--teal);
      box-shadow: 0 0 12px rgba(6, 214, 160, 0.4);
    }

    .solat-name {
      font-size: 1.35rem; /* Larger font */
      font-weight: 800;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }

    .solat-time {
      font-size: 1.5rem; /* Larger font */
      font-weight: 900;
      color: var(--gold);
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }

    /* RIGHT COL: Countdown */
    .next-label {
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      color: #f1f5f9;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    .next-prayer {
      font-size: 2.6rem;
      font-weight: 900;
      color: var(--teal);
      margin: 6px 0;
      text-shadow: 0 0 12px rgba(6, 214, 160, 0.7), 0 2px 4px rgba(0,0,0,0.9);
    }

    .countdown-box {
      font-size: 3rem;
      font-weight: 900;
      color: var(--gold);
      font-family: 'Courier New', Courier, monospace;
      background: rgba(0, 0, 0, 0.5);
      padding: 10px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 209, 102, 0.5);
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.6);
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }

    /* BOTTOM FOOTER: Hadith */
    .footer-bar {
      padding: 8px 16px;
      text-align: center;
    }

    .hadith-ar {
      font-size: 1.15rem;
      color: var(--gold);
      font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .hadith-en {
      font-size: 0.85rem;
      color: #f1f5f9;
      font-style: italic;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <!-- Dynamic Landscape Slideshow -->
  <div id="bg-carousel"></div>
  <div class="bg-overlay"></div>

  <div class="dashboard-container">
    
    <!-- TOP SECTION: Quran Verse -->
    <div class="quran-box glass-card">
      <div class="quran-ar" id="quran-ar">Loading...</div>
      <div class="quran-en" id="quran-en">Loading...</div>
    </div>

    <!-- MAIN DISPLAY (3 COLUMNS) -->
    <div class="main-grid">
      
      <!-- LEFT: Date & Time -->
      <div class="col-card glass-card">
        <div class="time-title">CURRENT TIME</div>
        <div class="clock-display" id="clock">00:00:00</div>
        <div class="gregorian-date" id="gregorian-date">Loading...</div>
        <div class="hijri-date" id="hijri-date">Loading...</div>
      </div>

      <!-- CENTER: Address Box ON TOP of Solat Box -->
      <div class="center-column">
        <!-- Address Box Header -->
        <div class="address-box glass-card">
          <strong>📍 No 8, Jalan Serene 3/4, Serene Heights</strong>
          <span>43500 Semenyih, Selangor (JAKIM: SGR01)</span>
        </div>

        <!-- Waktu Solat List -->
        <div class="solat-container glass-card">
          <div class="solat-row" id="row-subuh"><span class="solat-name">Subuh</span><span class="solat-time" id="time-subuh">05:52 AM</span></div>
          <div class="solat-row" id="row-syuruk"><span class="solat-name">Syuruk</span><span class="solat-time" id="time-syuruk">07:03 AM</span></div>
          <div class="solat-row" id="row-zohor"><span class="solat-name">Zohor</span><span class="solat-time" id="time-zohor">01:15 PM</span></div>
          <div class="solat-row" id="row-asar"><span class="solat-name">Asar</span><span class="solat-time" id="time-asar">04:21 PM</span></div>
          <div class="solat-row" id="row-maghrib"><span class="solat-name">Maghrib</span><span class="solat-time" id="time-maghrib">07:20 PM</span></div>
          <div class="solat-row" id="row-isyak"><span class="solat-name">Isyak</span><span class="solat-time" id="time-isyak">08:29 PM</span></div>
        </div>
      </div>

      <!-- RIGHT: Countdown -->
      <div class="col-card glass-card">
        <div class="next-label">COUNTDOWN TO</div>
        <div class="next-prayer" id="next-prayer-name">--</div>
        <div class="countdown-box" id="countdown">00:00:00</div>
      </div>
    </div>

    <!-- BOTTOM SECTION: Hadith -->
    <div class="footer-bar glass-card">
      <div class="hadith-ar" id="hadith-ar">Loading...</div>
      <div class="hadith-en" id="hadith-en">Loading...</div>
    </div>

  </div>

  <script>
    // Time-based Malaysian Sceneries (Unsplash HD)
    const malaysianScenes = {
      sunrise: [
        'https://images.unsplash.com/photo-1596422846543-75c6fc197f07?auto=format&fit=crop&w=1600&q=80',
        'https://images.unsplash.com/photo-1508009603885-50cf7c579365?auto=format&fit=crop&w=1600&q=80'
      ],
      daytime: [
        'https://images.unsplash.com/photo-1541086095944-f4b5412d3666?auto=format&fit=crop&w=1600&q=80',
        'https://images.unsplash.com/photo-1518548419970-58e3b4079ab2?auto=format&fit=crop&w=1600&q=80'
      ],
      afternoon: [
        'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1600&q=80',
        'https://images.unsplash.com/photo-1590001155093-a3c66ab0c3ff?auto=format&fit=crop&w=1600&q=80'
      ],
      evening: [
        'https://images.unsplash.com/photo-1609949279531-cf48d64bed89?auto=format&fit=crop&w=1600&q=80',
        'https://images.unsplash.com/photo-1510009228795-006f1eb7ebbe?auto=format&fit=crop&w=1600&q=80'
      ],
      night: [
        'https://images.unsplash.com/photo-1565689157206-0fddef7589a2?auto=format&fit=crop&w=1600&q=80',
        'https://images.unsplash.com/photo-1584646098378-0874589d76b1?auto=format&fit=crop&w=1600&q=80'
      ]
    };

    let bgIndex = 0;

    function updateBackground() {
      const hour = new Date().getHours();
      let sceneCategory = 'daytime';

      if (hour >= 6 && hour < 8) sceneCategory = 'sunrise';
      else if (hour >= 8 && hour < 14) sceneCategory = 'daytime';
      else if (hour >= 14 && hour < 18) sceneCategory = 'afternoon';
      else if (hour >= 18 && hour < 20) sceneCategory = 'evening';
      else sceneCategory = 'night';

      const images = malaysianScenes[sceneCategory];
      const imageUrl = images[bgIndex % images.length];
      
      document.getElementById('bg-carousel').style.backgroundImage = `url('${imageUrl}')`;
      bgIndex++;
    }

    // Fetch Daily Quranic Verse
    async function fetchDailyQuran() {
      try {
        const now = new Date();
        const dayOfYear = Math.floor((now - new Date(now.getFullYear(), 0, 0)) / 86400000);
        const verseNumber = (dayOfYear * 17) % 6236 + 1; 

        const arRes = await fetch(`https://api.alquran.cloud/v1/ayah/${verseNumber}/ar.alafasy`);
        const arData = await arRes.json();

        const enRes = await fetch(`https://api.alquran.cloud/v1/ayah/${verseNumber}/en.sahih`);
        const enData = await enRes.json();

        if (arData.code === 200 && enData.code === 200) {
          document.getElementById('quran-ar').innerText = arData.data.text;
          document.getElementById('quran-en').innerText = `"${enData.data.text}" — Surah ${enData.data.surah.englishName} (${enData.data.surah.number}:${enData.data.numberInSurah})`;
        }
      } catch (err) {
        document.getElementById('quran-ar').innerText = "الَّذِينَ آمَنُوا وَتَطْمَئِنُّ قُلُوبُهُم بِذِكْرِ اللَّهِ ۗ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ";
        document.getElementById('quran-en').innerText = "\"Those who believe and whose hearts find rest in the remembrance of Allah.\" — Surah Ar-Ra'd 13:28";
      }
    }

    // Fetch Daily Sahih Hadith
    async function fetchDailyHadith() {
      try {
        const res = await fetch(`https://random-hadith-generator.vercel.app/bukhari/`);
        const data = await res.json();

        if (data && data.data) {
          document.getElementById('hadith-ar').innerText = data.data.hadithArabic || "قَالَ رَسُولُ اللَّهِ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ...";
          document.getElementById('hadith-en').innerText = `"${data.data.hadithEnglish}" — ${data.data.refno || 'Sahih Bukhari'}`;
        }
      } catch (err) {
        document.getElementById('hadith-ar').innerText = "مَنْ طَهَّرَ فِي بَيْتِهِ ثُمَّ مَشَى إِلَى بَيْتٍ مِنْ بُيُوتِ اللَّهِ لِيَقْضِيَ فَرِيضَةً كَانَتْ خُطُوَاتُهُ إِحْدَاهُمَا تَحُطُّ خَطِيئَةً وَالأُخْرَى تَرْفَعُ دَرَجَةً";
        document.getElementById('hadith-en').innerText = "\"He who purifies himself in his house and then walks to a house of Allah to perform an obligatory prayer, one step wipes away a sin and the other raises his status.\" — Sahih Muslim 666";
      }
    }

    const prayerTimesToday = {
      subuh: "05:52",
      syuruk: "07:03",
      zohor: "13:15",
      asar: "16:21",
      maghrib: "19:20",
      isyak: "20:29"
    };

    function updateClock() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', { hour12: true });

      const options = { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' };
      document.getElementById('gregorian-date').innerText = now.toLocaleDateString('en-US', options);

      try {
        document.getElementById('hijri-date').innerText = new Intl.DateTimeFormat('en-TN-u-ca-islamic', {
          day: 'numeric', month: 'long', year: 'numeric'
        }).format(now) + "H";
      } catch (e) {
        document.getElementById('hijri-date').innerText = "";
      }

      updateCountdown(now);
    }

    function updateCountdown(now) {
      const times = [
        { name: "Subuh", time: prayerTimesToday.subuh, rowId: "row-subuh" },
        { name: "Syuruk", time: prayerTimesToday.syuruk, rowId: "row-syuruk" },
        { name: "Zohor", time: prayerTimesToday.zohor, rowId: "row-zohor" },
        { name: "Asar", time: prayerTimesToday.asar, rowId: "row-asar" },
        { name: "Maghrib", time: prayerTimesToday.maghrib, rowId: "row-maghrib" },
        { name: "Isyak", time: prayerTimesToday.isyak, rowId: "row-isyak" }
      ];

      times.forEach(t => document.getElementById(t.rowId)?.classList.remove('active'));

      let nextPrayer = null;
      let nextPrayerTime = null;

      for (let p of times) {
        const [hours, minutes] = p.time.split(':');
        const pDate = new Date(now);
        pDate.setHours(parseInt(hours), parseInt(minutes), 0, 0);

        if (pDate > now) {
          nextPrayer = p.name;
          nextPrayerTime = pDate;
          document.getElementById(p.rowId)?.classList.add('active');
          break;
        }
      }

      if (!nextPrayer) {
        nextPrayer = "Subuh";
        const [hours, minutes] = prayerTimesToday.subuh.split(':');
        nextPrayerTime = new Date(now);
        nextPrayerTime.setDate(nextPrayerTime.getDate() + 1);
        nextPrayerTime.setHours(parseInt(hours), parseInt(minutes), 0, 0);
        document.getElementById("row-subuh")?.classList.add('active');
      }

      document.getElementById('next-prayer-name').innerText = nextPrayer;

      const diffMs = nextPrayerTime - now;
      const hrs = Math.floor(diffMs / (1000 * 60 * 60));
      const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
      const secs = Math.floor((diffMs % (1000 * 60)) / 1000);

      document.getElementById('countdown').innerText = 
        `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    // Initialize
    fetchDailyQuran();
    fetchDailyHadith();
    updateBackground();
    updateClock();

    setInterval(updateClock, 1000);
    setInterval(updateBackground, 20000); // 20s Slideshow
  </script>
</body>
</html>
