<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Next Solat - Semenyih (SGR01)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: #090d16;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Dark overlay over mosque photo for high text contrast */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(7, 11, 20, 0.72) 0%,
        rgba(7, 11, 20, 0.84) 100%
      );
      z-index: 0;
      pointer-events: none;
    }

    .panel {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 28px 34px;
      text-align: center;
      display: grid;
      grid-template-columns: 1fr 1px 1.25fr;
      grid-template-rows: 1fr auto;
      align-items: center;
      gap: 20px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }

    .section-left,
    .section-right {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .label {
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .clock {
      font-size: 2.7rem;
      font-weight: 800;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    .date-line {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-top: 8px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    .hijri-line {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fcd34d;
      margin-top: 4px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
    }

    .divider {
      width: 1px;
      height: 82%;
      background: rgba(255, 255, 255, 0.14);
      justify-self: center;
    }

    /* Bigger solat wording and solat time */
    .next-name {
      font-size: 3.8rem;
      font-weight: 900;
      line-height: 1.08;
      color: #34d399;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.8);
    }

    .next-time {
      font-size: 3.4rem;
      font-weight: 900;
      line-height: 1.12;
      color: #fbbf24;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      margin-top: 6px;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.8);
    }

    /* Smaller countdown */
    .countdown-wrap {
      margin-top: 12px;
    }

    .countdown-label {
      font-size: 0.72rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 2px;
    }

    .countdown {
      font-size: 1.25rem;
      font-weight: 700;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #7dd3fc;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.75);
    }

    .status {
      grid-column: 1 / -1;
      font-size: 0.78rem;
      color: #94a3b8;
      padding-top: 4px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Stack vertically on narrow/portrait screens */
    @media (max-width: 699px) {
      body {
        overflow-y: auto;
      }

      .panel {
        max-width: 540px;
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        gap: 18px;
        padding: 24px 20px;
      }

      .divider {
        width: 100%;
        height: 1px;
      }

      .next-name {
        font-size: 3rem;
      }

      .next-time {
        font-size: 2.7rem;
      }
    }
  </style>
</head>
<body>
  <main class="panel">
    <section class="section-left">
      <div class="label">Current Time & Date</div>
      <div class="clock" id="clock">--:--:--</div>
      <div class="date-line" id="gregorian-date">---</div>
      <div class="hijri-line" id="hijri-date">---</div>
    </section>

    <div class="divider"></div>

    <section class="section-right">
      <div class="label">Next Solat • Semenyih (SGR01)</div>
      <div class="next-name" id="next-name">--</div>
      <div class="next-time" id="next-time">--:--</div>

      <div class="countdown-wrap">
        <div class="countdown-label">Countdown</div>
        <div class="countdown" id="countdown">00:00:00</div>
      </div>
    </section>

    <div class="status" id="status-text">Syncing Semenyih (SGR01) schedule...</div>
  </main>

    function applyRandomMosqueBackground() {
      if (!MOSQUE_IMAGES.length) return;
      const idx = Math.floor(Math.random() * MOSQUE_IMAGES.length);
      document.body.style.backgroundImage = `url("${MOSQUE_IMAGES[idx]}")`;

    function formatDDMonthYYYY(day, monthName, year) {
      const dd = String(day).padStart(2, "0");
      return `${dd} ${monthName} ${year}`;
    }

    function formatGregorianDDMonthYYYY(now) {
      const dd = String(now.getDate()).padStart(2, "0");
      const monthName = GREGORIAN_MONTHS_BM[now.getMonth()];
      const yyyy = now.getFullYear();
      return `${dd} ${monthName} ${yyyy}`;
    }

    function formatHijriFromParts(dayNum, monthNum, yearStr) {
      const monthName = (monthNum >= 1 && monthNum <= 12)
        ? HIJRI_MONTHS_BM[monthNum - 1]
        : String(monthNum);
      return `${formatDDMonthYYYY(dayNum, monthName, yearStr)} H`;
    }

      return match[1].padStart(2, "0") + ":" + match[2].padStart(2, "0");
